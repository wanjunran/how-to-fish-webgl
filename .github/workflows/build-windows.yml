name: Windows Cloud Build (v3)

on:
  workflow_dispatch:
  push:
    branches: [ windows-v3 ]

jobs:
  build-windows:
    name: Build StandaloneWindows64
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Restore Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Win64-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Assets/**') }}
          restore-keys: |
            Library-Win64-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-
            Library-Win64-

      - name: Build Windows64
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          versioning: None
          cliVersion: v0.1.72
          dockerMemoryLimit: 15g

      - name: Save Library cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-Win64-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Assets/**') }}

      - name: Upload Windows build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HowToFish-Windows64
          path: build
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "### 构建结果 ###" >> "$GITHUB_STEP_SUMMARY"
          if [ -d build ]; then
            du -sh build | tee -a "$GITHUB_STEP_SUMMARY"
            find build -maxdepth 2 -type f | head -50 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "**未生成 build 目录，构建失败。**" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
