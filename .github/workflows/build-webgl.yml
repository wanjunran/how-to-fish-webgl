name: WebGL Cloud Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 诊断报告那一步要往 ci-diagnostics 分支提交。
# 注意 branches 只列了 main —— 所以推 ci-diagnostics 不会再次触发本
# workflow，不存在死循环。
permissions:
  contents: write

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Restore Library cache
        uses: actions/cache@v4
        with:
          path: Library
          # key 与 Save 侧对齐（`-stable` 后缀），并去掉 hashFiles('Assets/**')。
          #
          # 为什么不带 Assets 哈希：下一个步骤 `Restore official shader sources`
          # 要读Library/PackageCache 里的官方 shader 源码。如果这里带
          # Assets 哈希，每轮我们改 shader（每轮都在改）都会导致缓存 miss ->
          # 空 Library -> sync 脚本必然跳过 -> 66 个空壳一个都覆盖不到，
          # 其中包括 59 个材质在用的 URP/Lit。
          #
          # Library 能否复用真正取决于 Unity 版本与包版本，跟 Assets 内容无关，
          # 所以这两项就是正确的 key 组成。
          key: Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}-stable
          restore-keys: |
            Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}-
            Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-
            Library-WebGL-

      # 把 URP/Core/ShaderGraph 包里的官方 shader 源码覆盖到 AssetRipper 留下的
      # 空壳上（按 Shader "名字" 匹配，保留 .meta GUID 所以材质引用不断）。
      # 版本来自 Library/PackageCache，与 Packages/manifest.json 声明的完全一致，
      # 不需要在网上猜版本；缓存未命中时脚本自行跳过，构建照常进行。
      - name: Restore official shader sources
        run: |
          mkdir -p verify-evidence
          python3 tools/sync_official_shaders.py

      # 必须在 Build 之前跑：这些是**改文件**的修正步骤，不是检查。
      #
      # 顺序很关键：
      #   sync_official_shaders -> 用官方源码覆盖空壳（可能直接换掉整个文件）
      #   fix_stub_basemap      -> 覆盖失败时兜底改名
      #   apply_surface_state   -> 按材质实际设置补渲染状态
      # 反过来的话，后一步的产物会被前一步覆盖掉。
      - name: Fix stub shader property names
        run: |
          mkdir -p verify-evidence
          python3 tools/fix_stub_basemap.py 2>&1 | tee verify-evidence/fix-stub-basemap.txt
          # 跑第二遍必须是 0：如果不是，说明脚本不幂等，
          # 那么 CI 这次改了的东西和下次不一样，就没法拿 diff 当判据。
          python3 tools/fix_stub_basemap.py --check 2>&1 \
            | tee -a verify-evidence/fix-stub-basemap.txt
          # 材质/属性错配检查：报「材质设了但 shader 没声明」的属性。
          # 这类失败 Unity 静默丢弃，日志里一个字都没有，只能靠比对发现。
          python3 tools/check_mat_shader_props.py 2>&1 \
            | tee verify-evidence/mat-shader-props.txt
          # keyword 检查：报「材质勾了 keyword 但 shader 没声明 shader_feature」
          # 以及「原版多 Pass 但当前只有 1 个」。同样是静默失效。
          python3 tools/check_shader_keywords.py 2>&1 \
            | tee verify-evidence/shader-keywords.txt
          # 悬空引用检查：把「包内资产没导出」（正常）和「游戏自有资产丢失」
          # （真问题）分开。这个分流很重要 —— 判据若只判「找不到就是坏」，
          # 59 个正常项会淹掉真信号；若只判「都是正常」，真丢了没人知道。
          python3 tools/check_dangling_refs.py 2>&1 \
            | tee verify-evidence/dangling-refs.txt
          # 天空盒链路：碧海蓝天是用户最想看到的东西，而它是唯一一个
          # 在启动场景里、不依赖任何游戏内逻辑就能出结果的渲染产物 ——
          # 所以最适合当「渲染管线通没通」的探针。查的是数据完整性
          # （材质/颜色/相机 ClearFlags/pragma target），不是画面观感。
          python3 tools/check_skybox.py 2>&1 \
            | tee verify-evidence/skybox.txt

      # 使用 game-ci/unity-builder v6 —— 这是首个内置 `personal` 授权策略的版本。
      #
      # 为什么必须用 v6 而不是 v4：
      #   v4 的 activate.sh 只有两条分支（serial / 许可服务器），Unity Personal
      #   根本走不通，导致 7 次构建全部失败在授权阶段。
      #
      #   v6 委托给 game-ci/cli，其激活链为 file -> serial -> floating -> personal。
      #   本仓库只提供 UNITY_EMAIL + UNITY_PASSWORD（不提供 UNITY_LICENSE /
      #   UNITY_SERIAL），因此自动解析到 `personal` 分支。该分支直接调用
      #   Unity.Licensing.Client 的 --activate-all --include-personal，
      #   正是 Unity 6 entitlement 体系下 Personal 账号唯一可行的激活路径。
      #
      #   关键背景：Unity 已取消 Personal 的离线（人工）激活，
      #   license.unity3d.com/manual 现在只对 Enterprise / Industry 开放。
      #   所以任何 .ulf 文件对免费账号都不可能存在 —— 之前 34 字节的
      #   UNITY_LICENSE 是死路，不是配置问题。
      #
      # 注意：personal 授权会占用一个 Personal seat，v6 会在 build 结束
      # （含失败/取消）时自动归还。若频繁失败导致 seat 被泄漏，
      # 到 https://id.unity.com 手动释放。
      - name: Build WebGL
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: WebGLCloudBuild.CloudWebGLBuild.Perform
          dockerMemoryLimit: 15g
          # 必须 None，不能留默认 Semantic，也不能写 NoIncrement。
          # 这个 game-ci CLI 版本（v0.1.72）的合法值是
          #   None / Semantic / Tag / Custom
          # Semantic 会在 build 前跑 `git status --porcelain`，
          # 一旦树"脏"就直接 [ERROR] Branch is dirty 退出；
          # CI 把 Library/ 从缓存恢复出来后它必然未跟踪 -> 树脏。
          # （Library/ 已加进 .gitignore，但其他未跟踪文件也可能让树脏。）
          # None = 直接用 ProjectSettings 里的现有版本，不做任何语义计算，
          # 因此不查脏树，最稳。NoIncrement 不是合法值，会直接报
          # "Invalid values ... Choices: None, Semantic, Tag, Custom"。
          versioning: None
          # 把 Unity 的日志重定向到工作区的确定路径。
          #
          # 为什么要显式指定：Unity 在 Linux 上默认写 `$HOME/.config/unity3d/
          # Editor.log`，但 unity-builder 以 root 跑构建，runner 的 HOME
          # 未必是 /root（可被 actions 环境改写），所以「猜 HOME」这个做法
          # 本身不可靠 —— 上一轮 5 个候选路径全落空，shader 错误扫描因此
          # 「扫了个空」还报成干净。
          #
          # 写进 ${{ github.workspace }} 是因为下一步从工作区读它，
          # 路径确定，判据才成立。相对路径不行：Unity 解析 -logFile 时
          # 的基准目录不确定。
          unityArgs: -logFile ${{ github.workspace }}/verify-evidence/Editor.log
          # 钉死 game-ci CLI 版本，别留默认的 latest。
          # latest 会让 action 每轮启动时调 GitHub API 解析最新 release；
          # 托管 runner 的出口 IP 是共享的，API 配额说没就没 —— run
          # 37299223456 就死在这里（"Failed to resolve the latest game-ci
          # CLI release: GitHub API returned 403"），连 Unity 都没启动。
          # 钉住后走本地解析+缓存（cache key: game-ci-cli-v0.1.72-linux-x64），
          # 不再依赖那一发 API 请求。
          cliVersion: v0.1.72

      # Save Library cache
      #
      # key 刻意**不含** hashFiles('Assets/**')。原因是这个步骤的结构性依赖：
      #
      # `Restore official shader sources` 在本步骤的**前一步**就要读
      # Library/PackageCache 里的官方shader 源码。如果 Save 用的是
      # `key: ...Assets/**`，那么每轮只要我们改了 shader（而这正是每一轮
      # 都在做的事），key 就变 -> Restore 缓存 miss -> 工作区里是空 Library
      # -> sync 脚本必然走「跳过」分支 -> 66 个空壳一个都覆盖不到。
      #
      # 实测证据：第一轮报告里出现了
      # `PackageCache/com.unity.render-pipelines.core@...`，说明那一轮
      # 确实恢复出了缓存；但同报告`grep -c universal` = 0，
      # universal 包不在里头 —— 而 59 个材质在用 URP/Lit。
      #
      # Library 里真正决定「能不能重新导入」的是 ProjectVersion +
      # manifest.json（Unity 版本、包版本），跟Assets 内容无关。
      # 所以 Save 存到与 restore-keys 对齐的稳定 key 上：Restore 靠前缀
      # 命中它，下一轮无论Assets 怎么变都能拿回 PackageCache。
      - name: Save Library cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}-stable

      # Unity 在 Linux 上把一切（含 shader 编译错误）写进 Editor.log。
      # 显式把它收拢到工作区固定路径 —— 靠猜$HOME/.config 还是
      # /root/.config 不可靠（unity-builder 以 root 跑构建，而runner
      # 用户的 HOME 可能被改写），而且这一步跑在「Save Library cache」
      # 之后，Unity 进程已经退出、日志不会再被覆写。
      #
      # 找得到 = 后面扫描有依据；找不到 = 打警告，让扫描步骤知道
      # 「没日志」和「日志干净」是两回事。
      - name: Collect Unity Editor log
        if: always()
        run: |
          set +e
          mkdir -p verify-evidence
          FOUND=""
          # 最优先：unityArgs -logFile 指定的确定路径。
          if [ -s "verify-evidence/Editor.log" ]; then FOUND="verify-evidence/Editor.log"; fi
          # 其次试已知位置。
          for p in "$HOME/.config/unity3d/Editor.log" \
                   /root/.config/unity3d/Editor.log \
                   "$HOME/.local/share/unity3d/Editor.log" \
                   /var/log/unity3d/Editor.log \
                   "$RUNNER_TEMP/Editor.log"; do
            [ -n "$FOUND" ] && break
            if [ -f "$p" ] && [ -s "$p" ]; then
              cp "$p" verify-evidence/Editor.log
              FOUND="$p"
            fi
          done
          # 最后 find 兜底 —— unity-builder 在容器里跑，Unity 可能写在
          # 任何地方，而路径随版本变过。上一轮 5 个候选全落空就是没做这层。
          if [ -z "$FOUND" ]; then
            CAND=$(find / -name "Editor.log" -type f -size +1k 2>/dev/null \
                   | head -3 | tail -1)
            if [ -n "$CAND" ]; then
              cp "$CAND" verify-evidence/Editor.log
              FOUND="$CAND (find 兜底)"
            fi
          fi
          if [ -n "$FOUND" ]; then
            echo "::notice::Unity 日志: $FOUND ($(wc -c < verify-evidence/Editor.log) 字节)"
            echo "已收集 Unity 日志 $(wc -c < verify-evidence/Editor.log) 字节" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::没找到 Unity Editor.log —— shader 错误扫描将没有依据（这不代表 shader 没问题）"
            echo "**没找到 Unity Editor.log，shader 错误扫描无依据。**" \
              >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "找过:" >> "$GITHUB_STEP_SUMMARY"
            for p in "$HOME/.config/unity3d" /root/.config/unity3d "$RUNNER_TEMP"; do
              echo "  $p -> $(ls "$p" 2>/dev/null | head -5 | tr '\n' ' ')" \
                >> "$GITHUB_STEP_SUMMARY"
            done
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # 兜底扫描：按「文件类型」找日志，不猜目录。
      #
      # run 37422020996 的教训：`Collect Unity Editor log` 试了 5 个已知
      # 路径 + find 全盘兜底，**全部落空**，报告写着「没找到 Unity
      # Editor.log —— shader 结论无依据」。而同一份报告里 PackageCache
      # 完好（universal 包 84 个 .shader 都在），说明构建确实跑起来了。
      #
      # 结论是 Unity 没往任何 Editor.log 路径写 —— 继续猜路径没用，
      # 之前已经猜了 5 轮。改为在**已知的关键目录**内按类型找，
      # 并限定深度，避免 `find /` 那种全盘遍历（上一版会扫到海量系统
      # 日志，既慢又会淹没真信号）。
      #
      # 这一步还承担一件更实在的事：把「shader 到底编译失败几个」
      # 用**可复核的清单**列出来 —— 不只给一个总数，而是给
      # 「哪个shader 的哪一行报了什么」。总数只能让人知道有问题，
      # 清单才能让人开始修。
      - name: Capture build logs by type
        if: always()
        run: |
          set +e
          mkdir -p verify-evidence
          {
            echo "=== 按类型扫描 Unity 构建日志（限定目录，避免全盘 find）==="
            for d in "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOME" \
                     "$HOME/.config/unity3d" "/root/.config/unity3d" \
                     "/var/log/unity3d" "$HOME/.local/share/unity3d"; do
              [ -d "$d" ] || continue
              find "$d" -maxdepth 4 -type f \
                \( -name "*.log" -o -name "Editor.log*" -o -name "build*.txt" \) \
                -size +256 2>/dev/null | head -10
            done | sort -u
            echo
            echo "=== 含shader 编译错误的行 ==="
            FOUND_SHADER=0
            for d in "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOME"; do
              [ -d "$d" ] || continue
              while IFS= read -r f; do
                if grep -qi "shader error" "$f" 2>/dev/null; then
                  FOUND_SHADER=1
                  echo "--- $f"
                  grep -i -B1 -A3 "shader error" "$f" 2>/dev/null | head -40
                fi
              done <<< "$(find "$d" -maxdepth 4 -type f \
                         \( -name "*.log" -o -name "Editor.log*" \) \
                         -size +256 2>/dev/null | head -20)"
            done
            if [ "$FOUND_SHADER" -eq 0 ]; then
              echo "（没有扫到 shader 编译错误记录）"
              echo "::warning::没扫到 shader 编译错误 —— 这**不代表 shader 没问题**，"
              echo "::warning::只代表没扫到日志。当前洋红 $( cat verify-evidence/magenta.txt 2>/dev/null | tail -2 | head -1 )"
            fi
          } | tee verify-evidence/build-logs-scan.txt | \
              tail -80 >> "$GITHUB_STEP_SUMMARY"
          echo "已落盘 verify-evidence/build-logs-scan.txt"

      # 抓 shader 编译错误。
      #
      # 为什么必须有这一步 —— 这是本项目最贵的一个教训：
      #
      #   **Unity 编译 shader 失败不会让构建失败。** 它只是把那个材质
      #   渲成洋红（magenta），然后照常打包、照常 exit 0。
      #
      # 所以在此之前，「CI 全绿」这件事对 shader 正确性的信息量是**零**。
      # run #90 / #91 连续两轮报success，而那批产物里 17 个 shader 有
      # `SV_Target1` 赋值却从无声明（MRT 第二输出整个丢失），
      # 另有 2 个（URPDecal / LaserDotDecal）引用 URP 的 APV 探针
      # SSBO —— GLES 3.0 根本没有 SSBO。这些在 WebGL2 上全部编译不过。
      # 它们之所以能一路绿灯推上去，就是因为没人看 shader 日志。
      #
      # 判据：Unity 把 shader 编译错误以 `Shader error in 'xxx': ...` 的
      # 形式打进构建日志。扫描全部候选日志文件（unity-builder 的输出位置
      # 随版本变过，所以用 glob 找），命中就打 ::error:: —— 注解直接出现
      # 在 run 页面列表里，匿名 curl 抓得到（这是本文件既有的约定，见下面
      # Publish verification verdict 的注释）。
      #
      # 不 exit 1：shader 报错不该阻断构建（产物仍可用于验证其他问题），
      # 但必须让信息落盘成证据，并在 run 页面上留痕。
      - name: Scan for shader compile errors
        if: always()
        run: |
          set +e
          echo "### shader 编译错误扫描 ###" >> "$GITHUB_STEP_SUMMARY"

          # Unity 的构建日志散落在好几个地方，位置随unity-builder 版本和
          # runner 镜像变。上一版只列了三个（build.log / logs / artifacts），
          # 全都可能不存在 —— 那就等于「扫了个空」，还会报成"干净"，
          # 比不扫更坏。所以：把已知位置全试一遍 + find 兜底，
          # 并且**区分「没找到日志」和「日志里没有 shader 错误」**。
          LOGS=""
          for p in build.log unity-build.log \
                   verify-evidence/Editor.log \
                   "$HOME/.config/unity3d/Editor.log" \
                   /root/.config/unity3d/Editor.log \
                   logs artifacts; do
            if [ -e "$p" ]; then LOGS="$LOGS $p"; fi
          done
          # 兜底：工作区里任何名字带 log 的文本文件
          EXTRA=$(find . -maxdepth 3 -name "*.log" -type f 2>/dev/null | head -10)
          LOGS="$LOGS $EXTRA"
          LOGS=$(echo "$LOGS" | tr ' ' '\n' | grep -v '^$' | sort -u)

          if [ -z "$LOGS" ]; then
            echo "::warning::没找到任何 Unity 构建日志 —— shader 错误扫描**未执行**（不是「干净」）"
            echo "**未找到构建日志，shader 错误扫描未执行。**" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "注意：这不代表 shader 没问题，只代表没东西可扫。" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "扫描日志:"; echo "$LOGS" | sed 's/^/  /'
          # 报告实际扫了多少字节 —— 万一是空文件，结论不成立
          TOTAL=$(cat $LOGS 2>/dev/null | wc -c)
          echo "日志总字节: $TOTAL"
          if [ "$TOTAL" -lt 200 ]; then
            echo "::warning::日志只有 $TOTAL 字节，基本是空的，扫描结论不可信"
          fi

          #两类都要：error 必须抓，warning 里也常藏着真正的类型不匹配
          SHADER_HITS=$(grep -ah -E \
            "Shader (error|warning) in|error in '.*':.*undeclared|is not declared|no member named" \
            $LOGS 2>/dev/null | sort -u | cut -c1-220)

          mkdir -p verify-evidence
          echo "$SHADER_HITS" > verify-evidence/shader-errors.txt

          if [ -n "$SHADER_HITS" ]; then
            N=$(printf '%s\n' "$SHADER_HITS" | wc -l)
            echo "::error::构建日志里有 $N 条 shader 编译错误/警告（详见 verify-evidence/shader-errors.txt）"
            printf '%s\n' "$SHADER_HITS" | head -12 | while IFS= read -r l; do
              echo "::error::shader: $(printf '%s' "$l" | head -c 200)"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**$N 条 shader 编译错误/警告：**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$SHADER_HITS" | head -20 \
              >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "shader 编译错误扫描：干净"
            echo "**shader 编译错误扫描：干净。**" >> "$GITHUB_STEP_SUMMARY"
          fi

          # ---- C# 编译错误扫描 ----
          #
          # 为什么必须单独扫：上面那个步骤只查 shader，而 Unity 的
          # **C# 编译错误**是完全不同的失败模式 —— 它会让 IL2CPP 编译中止、
          # 产物里没有可用的 .data/.wasm，表现是「构建绿了但页面加载失败」，
          # 跟 shader 洋红毫无关系。两类混在一起就会只看见自己期待的那个。
          #
          # 具体要盯的是类型不存在的错误（CS0246）。目前有一个待确认的疑点：
          # ConnectionManager.SetTransport() 调用 `_multipass.SetClientTransport<UnityTransport>()`，
          # 而 `UnityTransport` 这个类型在**整个仓库里搜不到定义**
          # （FishNet 源码树里没有 UTP 目录，连 .meta 都没有；备份的
          # FishNet.Runtime.dll 里这个字符串出现 0 次，而 Tugboat 出现 50 次）。
          # 也就是说那行代码依赖一个不存在的类型 —— 但历史 CI 日志里
          # `error CS` 计数是 0，两者矛盾。
          #
          # **这个矛盾必须由数据回答，不能靠推断。** 所以这里把 C# 错误
          # 单独落盘成文件，不 exit 1（还要继续取证），并在报告里显式
          # 点名查这个疑点。
          CS_HITS=$(grep -ah -E \
            "error CS[0-9]{4}|Compilation failed|Scripts have compiler errors" \
            $LOGS 2>/dev/null | sort -u | cut -c1-260)
          echo "$CS_HITS" > verify-evidence/cs-errors.txt
          if [ -n "$CS_HITS" ]; then
            NCS=$(printf '%s\n' "$CS_HITS" | wc -l)
            echo "::error::构建日志里有 $NCS 条 C# 编译错误（详见 verify-evidence/cs-errors.txt）"
            printf '%s\n' "$CS_HITS" | head -10 | while IFS= read -r l; do
              echo "::error::cs: $(printf '%s' "$l" | head -c 240)"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**$NCS 条 C# 编译错误：**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$CS_HITS" | head -20 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            # 「没扫到 C# 错误」有两种可能，日志里没有 / 日志根本没覆盖到
            # 编译阶段。必须区分开，否则这份结论没有信息量。
            if [ "$TOTAL" -lt 200 ]; then
              echo "::warning::C# 错误扫描不可信：日志只有 $TOTAL 字节"
              echo "**C# 错误扫描未执行**：日志只有 $TOTAL 字节，" \
                "扫了个空，不代表 C# 编译没问题。" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "C# 编译错误扫描：干净（$TOTAL 字节日志）"
              echo "**C# 编译错误扫描：干净**（扫了 $TOTAL 字节日志）。" \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # 待确认疑点的自证：UnityTransport 是否真的没被编译到
          echo "== 待确认：UnityTransport（CS0246 疑点）==" \
            >> "$GITHUB_STEP_SUMMARY"
          grep -ah -i "UnityTransport" $LOGS 2>/dev/null | head -5 \
            | cut -c1-200 >> "$GITHUB_STEP_SUMMARY" || true
          echo "(上面若为空 = 日志里没提到它；这**不能**证明它存在或不存在)" \
            >> "$GITHUB_STEP_SUMMARY"

      # 让 CI 顺手回答一个本地答不了的问题：URP 官方源码里，APV
      # （Adaptive Probe Volumes）那套 SSBO 球谐采样是被什么宏门控的。
      #
      # URPDecal / LaserDotDecal 的每一个 PS 变体都无条件编译进了
      # `readonly buffer _Structured_tN`（std430 SSBO），GLES 3.0 没有这
      # 东西，WebGL2 上必挂。本地没有 Library/PackageCache（Unity 从没在
      # 沙箱里跑过），所以查不到 URP 源码原文。
      #
      # 而这不能靠猜 —— 猜错了就等于手写光照逻辑，正是本项目禁止的。
      # 官方 shader 源码是权威答案：它会写明 APV 分支的 #if 条件，
      # 我们照着把同名宏加到 #pragma multi_compile 后面，
      # 编译器自己就把整段 SSBO 代码消解掉 —— 全程零手写。
      - name: Dump URP APV guard macros
        if: always()
        run: |
          set +e
          mkdir -p verify-evidence
          # 多路径探测。上一版只查 Library/PackageCache 一个地方，artifact
          # 只有 1223 字节（那点体积全是上一轮 verify 步骤写的文件），
          # 说明这一步大概率什么都没dump 出来。原因值得记下来：
          # **Unity 装的是编译后的 shader 包，官方 .shader 源码通常不在
          # PackageCache 里** —— sync_official_shaders.py 依赖的那个目录
          # 未必存在。所以这里把能想到的位置都试一遍，并如实报告
          # 「都没找到」，而不是默默跳过。
          CANDIDATES=$(ls -d \
            Library/PackageCache/com.unity.render-pipelines.universal@* \
            Library/PackageCache/com.unity.render-pipelines.core@* \
            Packages/com.unity.render-pipelines.universal* \
            2>/dev/null | head -6)
          echo "候选目录: ${CANDIDATES:-（无）}"

          if [ -z "$CANDIDATES" ]; then
            echo "::warning::URP 包源码在构建机上不存在（Library/PackageCache 未命中或只装了编译产物）—— 无法取得 APV 门控宏的官方依据"
            echo "**URP 源码不可用，APV 门控宏未能取得。**" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "ls Library/PackageCache | head -20 实际内容：" \
              >> "$GITHUB_STEP_SUMMARY"
            ls Library/PackageCache 2>/dev/null | head -20 \
              >> "$GITHUB_STEP_SUMMARY" || echo "（目录不存在）" \
              >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 全盘找官方 shader 源码，任何一个 .shader 文件都算命中
          ANY=$(find $CANDIDATES -name "*.shader" 2>/dev/null | head -3)
          if [ -z "$ANY" ]; then
            echo "::warning::候选目录里没有任何 .shader 源码（Unity 装的是编译产物），APV 门控宏无从取得"
            echo "**候选目录里没有.shader 源码（Unity 装的是编译产物）。**" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "找到 .shader: $ANY"

          # 只找 SSBO / APV 相关的那几行，别把整个 Lit.shader 倒出来
          #
          # 上一版的做法是 `find ... | head -400` 然后 grep SSBO —— 结果拿到
          # 的全是 core 包 PathTracing / GPUDriven / VRS / DebugOcclusion 的
          # StructuredBuffer，**一条 APV 都没有**。原因很具体：head -400 按
          # 字母序截断，而 PathTracing 在 core 包里排在 ProbeVolume 之前，
          # 预算全被前者吃掉了。所以那轮「APV 相关行」的结论是无效的。
          #
          # 改成两步：先按**路径含 ProbeVolume/APV** 精准锁定相关文件
          # （这才是 APV 球谐 SSBO 的所在），再在这些文件里抓 SSBO 声明
          # 及其外层的 #if/#ifdef 门控宏。门控宏才是我们要的东西 ——
          # 给产物加上同名宏，编译器就会自己消解掉整段 SSBO 代码。
          {
            echo "### 1. ProbeVolume / APV 相关文件清单"
            find $CANDIDATES -type f \
                 \( -name "*.hlsl" -o -name "*.shader" -o -name "*.cs" \) \
                 2>/dev/null | grep -i -E "probevolume|probe.*volume|apv|adaptiv" \
                 | sed "s|^|  |" | head -40
            echo ""
            echo "### 2. 这些文件里StructuredBuffer 声明及其外层门控宏"
            for f in $(find $CANDIDATES -type f \
                        \( -name "*.hlsl" -o -name "*.shader" -o -name "*.cs" \) \
                        2>/dev/null | grep -i -E "probevolume|probe.*volume|apv|adaptiv"); do
              hits=$(grep -n -E "StructuredBuffer|#if|#ifdef|#ifndef|#else|#endif" "$f" 2>/dev/null | head -40)
              [ -n "$hits" ] && { echo "=== ${f#$GITHUB_WORKSPACE/} ==="; echo "$hits"; }
            done
            echo ""
            echo "### 3. 全包内含StructuredBuffer 的 APV 相关文件（兜底：不限定文件名）"
            grep -rl "StructuredBuffer" $CANDIDATES --include="*.hlsl" 2>/dev/null \
              | grep -i -E "probevolume|apv|adaptiv" | sed "s|^|  |" | head -20
          } | tee verify-evidence/urp-apv-guards.txt > /tmp/apv.txt

          N=$(wc -l < /tmp/apv.txt)
          echo "APV/SSBO 相关行数: $N"
          if [ "$N" -gt 0 ]; then
            # 注解：匿名 curl 抓run 页面就能看到，不必下载 artifact
            head -20 /tmp/apv.txt | while IFS= read -r l; do
              [ -z "$l" ] && continue
              echo "::notice::APV: $(printf '%s' "$l" | head -c 200)"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**URP 里的 APV / SSBO 相关行（前 30 条）：**" \
              >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -30 /tmp/apv.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::在 URP 源码里没找到 APV/SSBO 相关行"
          fi

      - name: Upload APV guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-and-apv-evidence
          path: verify-evidence/
          if-no-files-found: ignore

      # 在构建机上真的把播放器跑起来。
      #
      # 为什么必须这一步：轮次 23 出现过"构建全绿、产物 207MB、B 层离线校验
      # 12/12 全过，但一加载场景就抛 function signature mismatch"。离线校验
      # 只证明文件完整，证明不了它能跑。把验证放在构建机上，产物根本不用经过
      # 我的沙箱（上行 77KB/s，186MB 要 40 分钟）。
      #
      # 判据是Unity 模板里 #unity-loading-bar 变成 display:none，
      # 也就是 createUnityInstance().then() 那个分支—— 主场景真的加载完了。
      # 不要改成"画布拿到 WebGL 上下文"：那发生在 wasm 实例化时，
      # 也就是加载场景之前，而签名不匹配恰恰是在加载场景时抛的，
      # 那样判据在坏产物上照样会通过。见 tools/verify_load.py 的注释。
      #
      # 三个浏览器参数缺一不可，少一个就是"环境不支持 WebGL"而非"产物有问题"：
      #   xvfb-run                 没有 X server，Chrome 连 GL 后端都起不来
      #   --use-angle=swiftshader  软件实现 WebGL2（runner 无 GPU）
      #   --enable-unsafe-swiftshader  新版 Chrome 默认禁用软件 WebGL
      - name: Verify the build actually loads
        if: always()
        run: |
          set +e
          echo "### 产物实跑验证 ###" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f build/WebGL/index.html ]; then
            echo "**无 build/WebGL/index.html，跳过。**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---- xvfb：只在该装的时候装 ----
          #
          # GitHub runner 镜像自带 Xvfb（Firefox 的 bedrock 仓库为此专门
          # 去掉过安装步骤，原话是"apt-install of things"是 GHA 上最不
          # 可靠的一环之一）。之前这里无条件 apt-get install xvfb，
          # run 37266853299 就挂在这一步之后。
          #
          # 但不能只信"runner 自带"：万一换了镜像或被裁剪过，
          # 没有 X server 的症状是 Chrome 报 "Missing X server or $DISPLAY"，
          # 看起来像产物问题。所以是"有就用，没有才装"，
          # 并且装完立刻复查，别让失败静默滑过去。
          if command -v Xvfb > /dev/null 2>&1; then
            echo "Xvfb 已就绪: $(command -v Xvfb)"
          else
            echo "Xvfb 缺失，尝试安装"
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
            if ! command -v Xvfb > /dev/null 2>&1; then
              echo "::error::装不上 Xvfb，软件渲染验证无法进行（这是环境问题，不是产物问题）"
              echo "**Xvfb 不可用，实跑验证未执行。**" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Xvfb 安装完成: $(command -v Xvfb)"
          fi

          # ---- playwright（只装库，不下浏览器）----
          #
          # 必须用 venv：直接 pip3 install 会报
          #   Permission denied: '/home/runner/.local/lib'
          # 因为 unity-builder 以 root 跑过构建，runner 用户的 HOME 下
          # 若干目录的属主变成了 root，pip 又不肯降级写入。
          # venv 建在 /tmp 下，绕开这个权限残局。
          # （venv + pip 实测只要 7 秒，不是瓶颈。）
          python3 -m venv /tmp/venv || { echo "::error::建venv 失败"; exit 1; }
          # **Pillow 必须一起装。** 洋红统计靠它读 PNG，而它原先只在
          # verify_load.py 里以 `except ImportError:跳过` 的方式import ——
          # 也就是说 venv 里缺 Pillow 时统计会**静默跳过**，报告写「无记录」，
          # 和「统计跑了但没有洋红」在报告里长得一模一样。
          # 显式装上，并把版本钉住，避免镜像预装差异导致行为漂移。
          /tmp/venv/bin/pip install -q playwright "Pillow>=10,<12" || {
            echo "::error::装 playwright/Pillow 失败"; exit 1; }

          # 不下playwright 自带的 Chromium。
          #
          # 实测数据：venv + pip 只要 7 秒，而 "playwright install chromium"
          # 下 170 MB 跑了 8 分钟仍未完成。run 37267536242 的验证步骤
          # 总共只有 36 秒 —— 装浏览器的时间根本不够，那个失败
          # 几乎肯定卡在这里。
          #
          # runner 镜像自带 Chrome/Chromium，直接用它：
          # 少一个 170MB 下载，也就少一个失败点。
          # tools/verify_load.py 里的 find_chrome() 会按这个顺序找。
          echo "--- 找runner 自带的浏览器"
          for b in /usr/bin/google-chrome /usr/bin/google-chrome-stable \
                   /usr/bin/chromium /usr/bin/chromium-browser \
                   /opt/google/chrome/chrome; do
            if [ -x "$b" ]; then
              echo "找到: $b"
              "$b" --version 2>/dev/null | head -1
              break
            fi
          done

          # Chromium 的系统依赖。之前这里无条件 apt-get install 一串库，
          # 同样有把 apt 状态搞坏的风险（run 37266853299 就是前车之鉴：
          # 报E: Unmet dependencies，而 set +e 让它静默滑过去）。
          # runner 镜像本来就带齐了这些库，真的缺的话
          # launch 会明确报缺哪个 .so —— 那比语焉不详的 apt 错误有用得多。
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2 2>&1 | tail -2
          echo "（上面若有 apt 报错可忽略：镜像自带这些库）"

          # 先剥掉 Windows 版的死重量，再解压。
          #
          # 产物里带着 89 MB Windows 专用资源
          # （StreamingAssets/aa/StandaloneWindows64 和 APVStreamingAssets），
          # WebGL 运行时不会有任何代码去读它们—— settings.json 里
          # m_buildTarget 写死 StandaloneWindows64，catalog 里也没有
          # WebGL 路径，而脚本里 Addressables 引用数为 0。
          # 详见 tools/strip_platform_assets.py 里的三条证据。
          #
          # 放在解压之前，是因为 .gz 也要一起删掉；
          # 放在验证之前，是因为要验证的正是用户最终会拿到的那份产物。
          #
          # 必须 sudo：unity-builder 以 root 构建，产物属主是 root，
          # runner 用户 rmtree 会Permission denied。
          # 上一版忘了 sudo，日志里明明白白写着
          #   ::warning::剥离平台资源失败，继续用完整产物
          # 而我直到抓注解才看到——体积一点没降。
          sudo python3 tools/strip_platform_assets.py build/WebGL --apply || \
            echo "::warning::剥离平台资源失败，继续用完整产物（只是体积大）"

          # 必须预解压并去掉 Content-Encoding：body 已是解压态，
          # 再声明压缩会让浏览器把裸数据当压缩流解，结果是坏的。
          #
          # 整个脚本用 sudo 跑：unity-builder 以 root 构建，产物属主是 root，
          # runner 用户 open(..., "wb") 会Permission denied。
          # 第一版就是这么失败的（WebGL.wasm 写不进去）。
          sudo python3 - <<'PY'
          import gzip, pathlib, shutil, sys
          root = pathlib.Path("build/WebGL")
          for gz in sorted(root.rglob("*.gz")):
              out = gz.with_name(gz.name[:-3])
              # 已有非空的裸文件就跳过：Library 缓存或重跑会让它先于
              # 上一步存在，写它同样会撞权限。
              if out.exists() and out.stat().st_size > 0:
                  print(f"跳过 {out.name}（已存在）")
                  continue
              with gzip.open(gz, "rb") as fi, open(out, "wb") as fo:
                  shutil.copyfileobj(fi, fo, length=1 << 20)
              print(f"解压 {gz.name} -> {out.name}"
                    f"({out.stat().st_size / 1048576:.1f} MB)")

          # index.html 里写的是 .gz 文件名，改成无后缀的裸文件名，
          # 这样不依赖任何响应头。
          html = root / "index.html"
          t = original = html.read_text(encoding="utf-8")
          for n in ("WebGL.data", "WebGL.wasm", "WebGL.framework.js"):
              t = t.replace(f"/{n}.gz", f"/{n}")
          if t != original:
              html.write_text(t, encoding="utf-8")
              print("index.html 已改为引用裸文件名")
          else:
              print("index.html 已是裸文件名")

          # 解压失败必须在这里停住。步骤开头有 set +e（为了不让
          # 验证脚本的失败被吞），所以不主动 exit 的话，解压挂了会
          # 一路滑到验证脚本，报出来的是"加载失败"这种二手结论，
          # 而真正原因是"文件没解开"。一手信息不该被二手结论盖掉。
          missing = [n for n in ("WebGL.data", "WebGL.wasm",
                                 "WebGL.framework.js", "WebGL.loader.js")
                     if not (root / "Build" / n).exists()]
          if missing:
              print("!! 解压后仍缺文件: " + ", ".join(missing), flush=True)
              sys.exit(1)
          print("三个大文件均已就位")
          PY
          if [ $? -ne 0 ]; then
            echo "::error::解压产物失败，验证无法进行"
            exit 1
          fi

          # 端口选8123，不选 8099。
          # Chromium 有一份「受限端口」名单（6000/666x/6697/10080 等），
          # 命中会直接net::ERR_UNSAFE_PORT，而且这个错发生在网络层，
          # 看起来像「服务没起来」，实际上是浏览器不让连。
          python3 -m http.server 8123 --directory build/WebGL > /tmp/srv.log 2>&1 &
          SRV=$!
          sleep 3
          curl -s -o /dev/null -w "index.html HTTP=%{http_code}\n" http://127.0.0.1:8123/
          curl -s -o /dev/null -w "loaderHTTP=%{http_code}\n" \
            http://127.0.0.1:8123/Build/WebGL.loader.js

          # 验证逻辑放在 tools/verify_load.py，不内嵌在 heredoc 里。
          # 两个实测过的坑：
          #   xvfb-run 会把 heredoc 从 stdin 拿走（去喂 xauth），
          #     sys.stdin.read() 返回空字符串；
          #   stdout 重定向到文件是块缓冲，脚本中途异常退出时
          #     缓冲区里的 print 全丢，只剩带flush 的第一行。
          # 写成文件后代码从文件读、所有 print 带 flush、异常路径有 traceback。
          #
          # 端口/超时用环境变量传，不写死在脚本里。
          export PLAYWRIGHT_BROWSERS_PATH=/tmp/pw-browsers
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          export VERIFY_URL=http://127.0.0.1:8123/
          export VERIFY_TIMEOUT=600

          # 注意没有 `| tee` —— 管道的退出码是最后一个命令的，
          # Python 的失败会被 tee 吞掉。第一版正是这样：
          # 解压 PermissionError、playwright ModuleNotFound，
          # 验证脚本压根没跑，步骤仍然 success。
          set +e
          timeout 780 xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/venv/bin/python tools/verify_load.py "$GITHUB_STEP_SUMMARY" \
            > /tmp/verify.log 2>&1
          VR=$?
          cat /tmp/verify.log
          set -e

          # 把日志和截图打包上传，理由很直接：
          # GitHub 的 job 日志下载接口要仓库管理员权限，
          # 我这个token 不是管理员，run 37266853299 失败时
          # 就只能看到"某个步骤红了"，看不到红在哪一行——
          # 只能靠猜。产物跑完了还在机器上，
          # 传出来比重新构建一次（十几分钟）便宜得多。
          mkdir -p verify-evidence
          cp -f /tmp/verify.log verify-evidence/ 2>/dev/null
          cp -f /tmp/verify_first_error.txt verify-evidence/ 2>/dev/null
          # console 全文：Unity C# 的 Debug.Log 全走 console，崩溃前最后几条
          # 日志直接写明引擎正在初始化什么。没有它，null function 只有索引没有语义。
          cp -f /tmp/verify_console.txt verify-evidence/ 2>/dev/null
          cp -f /tmp/srv.log verify-evidence/http-server.log 2>/dev/null
          cp -f verify_loaded.png verify_settled.png verify-evidence/ 2>/dev/null

          # 验证失败时，让构建机自己读 wasm 把结论报出来。
          #
          # 背景：签名错修好之后，错误变成了
          #   RuntimeError: null function at wasm-function[103863]
          # 这个问题源码层面看不出来——33 个方法名、签名、调用点
          # 全部核对无误（读 16/16、写 17/17）。只能读产物字节码。
          #
          # 而产物在构建机上。把 195 MB 下载到本地要 40 分钟
          # （上行 77 KB/s），让机器自己分析只要几秒。
          # wabt 的 wasm-objdump 是标准工具，解析正确；
          # 缺了就退回inspect_wasm.py 内置的解析器。
          if [ "$VR" -ne 0 ] && [ "$VR" -ne 4 ] && [ -f build/WebGL/Build/WebGL.wasm ]; then
            echo "--- 分析 wasm 函数表"
            # 从首因里抠出 wasm-function[NNN]
            WIDX=$(grep -a -oE 'wasm-function\[[0-9]+\]' \
              /tmp/verify_first_error.txt 2>/dev/null \
              | head -1 | grep -oE '[0-9]+' || true)
            echo "报错函数索引: ${WIDX:-（日志里没找到）}"
            sudo apt-get install -y -qq wabt 2>&1 | tail -1
            python3 tools/inspect_wasm.py build/WebGL/Build/WebGL.wasm \
              ${WIDX:+$WIDX} > /tmp/wasm_report.txt 2>&1
            # 只取关键行，避免注解过长被截断
            grep -E "表总项数|起始槽位|无条目|func\[|签名" \
              /tmp/wasm_report.txt 2>/dev/null | head -12 \
              >> verify-evidence/wasm-report.txt || true
            cat /tmp/wasm_report.txt 2>/dev/null | head -20

            # 光看一个函数不够——要看整条调用链。
            #
            # 判读的关键是比对「调用点期望的 type」和
            # 「被调函数实际的 type」。参数个数对不上就是
            # function signature mismatch，跟槽位空不空无关。
            # 只看报错的那个函数会看漏，必须顺着栈往下读。
            #
            # --no-disasm：整份 66 MB 反汇编要几分钟，
            # 而签名和表项用 wasm-objdump -x 就能拿到，几秒就够。
            # 判读 type 是否匹配不需要反汇编。
            echo "--- 解调用链"
            python3 tools/explain_crash.py build/WebGL/Build/WebGL.wasm \
              --stack-file /tmp/verify_first_error.txt --no-disasm \
              > /tmp/stack_report.txt 2>&1 || true
            head -30 /tmp/stack_report.txt 2>/dev/null || true
            {
              echo "=== 调用链（按栈顺序）==="
              grep -E "^\s*(func\[|表槽位|判定|>>)" /tmp/stack_report.txt 2>/dev/null \
                | head -30
            } >> verify-evidence/wasm-report.txt || true
          fi
          {
            echo "Xvfb: $(command -v Xvfb || echo缺失)"
            echo "浏览器: $(for b in /usr/bin/google-chrome \
              /usr/bin/google-chrome-stable /usr/bin/chromium \
              /usr/bin/chromium-browser; do \
              [ -x "$b" ] && echo "$b" && break; done)"
            echo "端口探测: $(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8123/ 2>/dev/null)"
            echo "日期: $(date -u)"
          } > verify-evidence/env.txt
          echo "---证据已收集到 verify-evidence/"

          # 把结论写进 check 的 title/summary。
          #
          # 理由：我这个token 不是仓库管理员，job 日志接口返回
          #   403 Must have admin rights
          # artifact 下载接口返回
          #   401 Requires authentication
          # 也就是说前两轮失败（run 37266853299 / 37267536242）
          # 我只能看到"某一步红了"，看不到红在哪，
          # 只能靠时间线猜——而猜错的代价是一次十几分钟的构建。
          #
          # 关键教训：上一版把结论写进了 step summary，
          # 但 step summary 在页面上是异步加载的片段，
          # 匿名curl 抓 run 页面根本取不到正文（实测只拿到
          # "退出码 2"这一句 注解里的文字）。
          # 而 ::error:: / ::warning:: 注解是直接出现在 run 页面
          # 列表里的，curl 抓得到。所以结论必须走注解。
          #
          # 顺便：上一轮拿到"退出码 2"就说明环境那关过了——
          # 浏览器起来了、页面加载了、然后报错。
          # 退出码 2 = 页面alert 或未捕获 JS 异常。
          # 优先用 verify_load.py 落盘的首因文件（完整 wasm 栈），
          # 退回到 grep 日志。这样"null function"这类需要看栈才能定位的
          # 错误，不会因为注解只能放一行而被削成一句没用的结论。
          if [ -f /tmp/verify_first_error.txt ]; then
            ALERTLINE=$(head -4 /tmp/verify_first_error.txt | tr '\n\r' '  ' \
              | sed 's/%/%25/g; s/:/%3A/g' | cut -c1-200)
          else
            ALERTLINE=$(grep -a -m1 -oE 'alert（[^）]*）: .{0,180}' \
              /tmp/verify.log 2>/dev/null | tr '\n\r' '  ' | cut -c1-200)
            [ -z "$ALERTLINE" ] && ALERTLINE=$(head -5 /tmp/verify.log 2>/dev/null \
              | tr '\n' ' ' | cut -c1-200)
          fi
          [ -z "$ALERTLINE" ] && ALERTLINE="（无日志，脚本可能没跑到打印）"

          # wasm 分析结论也拼进注解。null function 这类问题
          # 光看"函数索引 103863"没法判断，得知道那个槽位是空的
          # 还是签名不符——这两者的修法完全不同。
          if [ -f verify-evidence/wasm-report.txt ]; then
            WSLOT=$(grep -m1 -oE '起始槽位: [0-9]+' \
              verify-evidence/wasm-report.txt 2>/dev/null || true)
            WFUNC=$(grep -m1 -oE 'func\[[0-9]+\] 签名: [^ ]+' \
              verify-evidence/wasm-report.txt 2>/dev/null \
              | sed 's/%/%25/g' || true)
            [ -n "$WSLOT$WFUNC" ] && \
              ALERTLINE="$ALERTLINE | ${WSLOT} ${WFUNC}"
          fi
          BROWSER=$(for b in /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable /usr/bin/chromium \
            /usr/bin/chromium-browser; do
            [ -x "$b" ] && echo "$b" && break; done)
          [ -z "$BROWSER" ] && BROWSER="（未找到任何浏览器）"

          {
            echo "### 产物实跑验证"
            echo ""
            echo "退出码 \`$VR\` | 浏览器 \`$BROWSER\`"
            echo ""
            echo "首因："
            echo '```'
            echo "${ALERTLINE:-（无日志）}"
            echo '```'
            echo ""
            echo "完整日志在 verify-evidence artifact 里（需登录下载）。"
          } > /tmp/vr_summary.md
          tail -25 /tmp/verify.log 2>/dev/null | sed 's/^/    /' \
            >> /tmp/vr_summary.md || true

          case "$VR" in
            0)
              TITLE="验证通过：主场景加载完成"
              ;;
            4)
              # 软件渲染下 600s 仍未加载完，可能是慢而不是坏。
              # 如实记 warning，不让整个 job 变红（产物本身可能没问题，
              # 只是这台 runner 的 CPU 跑不动）。
              TITLE="验证超时（不判失败）"
              ;;
            1)
              TITLE="验证失败：function signature mismatch 仍存在"
              ;;
            2)
              TITLE="验证失败：页面报错，退出码 2"
              ;;
            3)
              TITLE="验证脚本自身出错，产物未被验证"
              ;;
            *)
              TITLE="验证失败，退出码 $VR"
              ;;
          esac
          echo "验证结论: $TITLE" >> "$GITHUB_STEP_SUMMARY"

          # 结论写进注解。注解直接出现在 run 页面，匿名可抓——
          # 这是实测唯一能读到的通道（step summary 抓不到）。
          # 单行、去掉换行，注解才不会被截断。
          # 还要转义 GitHub 注解的控制字符：% CR LF。
          # 错误信息里出现这三样东西的概率不低（堆栈、路径、进度百分比），
          # 而未转义的 % 会被当成转义序列，把后面的内容吃掉。
          ONELINE=$(echo "$ALERTLINE" | tr '\n\r' '  ' | tr -d '\r' \
            | sed 's/%/%25/g; s/:/%3A/g' | cut -c1-200)
          if [ "$VR" -eq 0 ]; then
            echo "::notice title=验证通过::主场景加载完成，用时见 summary"
          elif [ "$VR" -eq 4 ]; then
            echo "::warning title=验证超时::软件渲染下未在600s 内完成加载，判为环境慢而非产物坏"
          else
            echo "::error title=$TITLE::${ONELINE:-（无日志，脚本可能没跑到打印）}"
          fi

          # 非 0 且不是"超时"就一定让步骤红。
          # 退出码 4 是唯一的例外：软件渲染可能只是慢，
          # 那不等于产物有问题，如实记 warning 就好。
          if [ "$VR" -ne 0 ] && [ "$VR" -ne 4 ]; then
            exit 1
          fi

      # 洋红统计独立成一个步骤，且必须 if: always()。
      #
      # 为什么不能继续放在 verify_load.py 里：上一步末尾是
      #   if [ "$VR" -ne 0 ] && [ "$VR" -ne 4 ]; then exit 1; fi
      # 于是形成一条**只在坏产物时才断的链**：
      #   主场景加载失败 -> verify_load.py 非 0 退出 -> 统计没跑到
      #   -> magenta.txt 不存在 -> 报告写「无记录」
      #
      # 实测 run 37422020996 正是这个状态：截图好好地提交回了仓库
      # （verify_settled.png 76912 字节），本地算得出洋红 12.768%、
      # 颜色精确是 (254,0,254)，而报告里写着「无记录」。
      #
      # 问题在于主场景加载失败**恰恰是最需要这个数字的时候** ——
      # 那正是「画面为什么不对」的第一现场。把判据放在会被失败路径掐断的
      # 地方，等于在最需要它的时刻把它摘掉了。
      #
      # 所以这里只读已经落盘的 PNG，与 verify 步骤的成败完全解耦。
      # 脚本刻意**不因洋红而 exit 1**：后面还有截图提交与报告生成，
      # 那些证据同样重要，不能因为发现问题就中断取证。
      - name: Measure magenta area
        if: always()
        run: |
          set +e
          /tmp/venv/bin/python tools/magenta_stats.py \
            verify_loaded.png verify_settled.png /tmp/verify_loaded.png \
            /tmp/verify_settled.png 2>&1 | tee -a verify-evidence/magenta-run.log
          exit 0

      #点进单玩家模式再截一张 —— 这才是「用户能玩到」的验收。
      #
      # 背景（这个归因纠正过）：之前所有截图都停在启动 Logo 页，
      # 我一直当成「进不了场景」。查代码后发现是**归因错了**：
      #   MainMenuManager.Start() -> DelayedMainMenu() -> ToggleMenu(true)
      # ToggleMenu 只打开 _menuStuff、播音乐、显示 UI，**不切场景**。
      # 游戏就停在主菜单等点击，这是设计如此。而 verify_load.py
      # 只加载+截图，**从不点击**，所以没人点那个按钮。
      #
      # 按钮路径在数据上是通的（全部来自 Game.unity，不是推测）：
      #   SingleplayerButton(&1710) IsActive=1
      #   Button(&5185) m_Interactable=1，m_CallState=2
      #   m_OnClick -> ButtonManager.CreateLocalLobbyButton
      # 而 CreateLocalLobbyButton 走 CreateOfflineLobby()，纯本地不碰 Steam。
      #
      # 用 `if: always()`：主场景加载失败时这一步大概率也点不动，
      # 但**那正是最需要知道「点得动吗」的时候** —— 这条链要是
      # 本身是断的，排查方向完全不同。
      - name: Click into singleplayer and capture
        if: always()
        run: |
          set +e
          mkdir -p verify-evidence
          # http.server 是上一步起的；它可能已经随那一步结束而没了。
          # 这里自己起一个，不依赖上一步的进程还在不在。
          if ! curl -s -o /dev/null --max-time 5 http://127.0.0.1:8123/; then
            if [ -f build/WebGL/index.html ]; then
              python3 -m http.server 8124 --directory build/WebGL \
                > /tmp/srv2.log 2>&1 &
              sleep 3
              URL=http://127.0.0.1:8124/
              echo "上一步的 8123 没了，自己起8124"
            else
              echo "::warning::没有 build/WebGL/index.html —— 跳过点击验收。"
              echo "这一节为空**不代表**点不进游戏，只代表没有可点的产物。"
              exit 0
            fi
          else
            URL=http://127.0.0.1:8123/
          fi
          # 布局坐标先单独打一遍：即使浏览器那步挂了，坐标也留在日志里，
          # 「按钮在屏幕哪儿」这件事不需要渲染就能回答。
          /tmp/venv/bin/python tools/verify_ingame.py --url "$URL" \
            --layout-only 2>&1 | tee verify-evidence/ingame-layout.txt
          /tmp/venv/bin/python tools/verify_ingame.py --url "$URL" \
            --shots /tmp 2>&1 | tee verify-evidence/ingame-click.txt
          for s in ingame_before.png ingame_after.png; do
            [ -f "/tmp/$s" ] && cp -f "/tmp/$s" verify-evidence/ \
              && echo "已留证: $s"
          done
          exit 0

        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try { body = fs.readFileSync('/tmp/vr_summary.md', 'utf8'); }
            catch (e) { body = '（读不到验证摘要：' + e.message + '）'; }
            await core.summary.addRaw(body).write();
            core.info('验证摘要已写入 step summary');

# 把 CI 的诊断报告**和验证截图**提交回仓库。
          #
          # 为什么需要这条通路：artifacts 下载**需要认证**，而本地只有匿名
          # curl —— 实测 403（API 限流）/ 000（连接被拒），三种取法全试过：
          #   1. run 页面 HTML：注解是懒加载的，初始 HTML 里没有
          #   2. .../annotations_partial：需要登录，匿名拿不到
          #   3. api.github.com/check-runs：匿名可用，但配额很快耗尽
          # 结果就是「CI 跑完了，但我看不到它查到了什么」—— 前面几轮白等。
          #
          # 提交回仓库这条最笨也最可靠：本地 git pull 就有，不需要任何认证。
          # 截图也一起提交，因为**画面到底对不对**只能看图判断，
          # 文字报告说不清「哪里是洋红、哪里是纯白」。图很小（~60KB），
          # 且只留最近一份，成本可接受。
          #
          # 注意 branches只列了 main —— 所以推 ci-diagnostics 不会再次触发
          # 本 workflow，不存在死循环。
          # 只提交报告与图，不动 Assets —— 构建产物和源码都不碰。
      - name: Commit diagnostics report
        if: always()
        run: |
          set +e
          mkdir -p docs/ci-reports
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          OUT="docs/ci-reports/run-${GITHUB_RUN_ID}-${STAMP}.md"

          {
            echo "# CI 诊断报告 run ${GITHUB_RUN_ID}"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- 时间: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "- run: https://github.com/wanjunran/how-to-fish-webgl/actions/runs/${GITHUB_RUN_ID}"
            echo
            # 覆盖判决放**第二屏、紧跟洋红**：这两行是本报告里唯二
            # 能回答「画面为什么现在这样」的判据，而它们各自都曾经
            # 被 head -50 挤掉过 —— 挤掉之后「覆盖生效」和「覆盖没生效」
            # 在报告里完全一样，只能靠猜。所以判决行不只是打出来，
            # 还要**断言它在**（见下）：文件里没有就是构建有问题。
            echo "## 官方 shader 覆盖判决"
            echo
            SYNC=verify-evidence/official-shader-sync.txt
            VD=$(grep -m1 '^### 判决：覆盖' "$SYNC" 2>/dev/null)
            if [ -n "$VD" ]; then
              echo '```'
              echo "$VD"
              echo '```'
            else
              echo "::warning::official-shader-sync.txt 里没有「### 判决：覆盖」行。"
              echo "脚本没跑到这一步，或结构变了 —— **不代表覆盖成功**。"
            fi
            echo
            echo "三态含义：生效 / **未生效**（声称覆盖了但文件仍是空壳）/"
            echo "**未执行**（一个都没覆盖）。后两者画面不会变好。"
            echo
            echo "## 洋红（shader 编译失败）"
            echo
            if [ -s verify-evidence/magenta.txt ]; then
              echo '```'
              cat verify-evidence/magenta.txt
              echo '```'
              echo
              echo "判读：>= 0.5% 说明至少一个 shader 编译失败。"
              echo "本地校准基线（\#pragma target 3.5 时的截图）：13.19% / 12.77%。"
              echo "降到 0 附近才算修好。"
            else
              echo "**无记录** —— 说明 verify 步骤没跑到截图统计，"
              echo "或截图没生成。这一节为空**不代表画面没问题**。"
            fi
            echo
            echo "## 材质属性错配（材质设了但 shader 没声明）"
            echo
            if [ -s verify-evidence/mat-shader-props.txt ]; then
              echo '```'
              head -60 verify-evidence/mat-shader-props.txt
              echo '```'
            else
              echo "（无记录）"
            fi
            echo
            echo "## keyword 错配（材质勾了但 shader 没声明 shader_feature）"
            echo
            if [ -s verify-evidence/shader-keywords.txt ]; then
              echo '```'
              head -60 verify-evidence/shader-keywords.txt
              echo '```'
            else
              echo "（无记录）"
            fi
            echo
            echo "## 天空盒（碧海蓝天的来源）"
            echo
            if [ -s verify-evidence/skybox.txt ]; then
              echo '```'
              cat verify-evidence/skybox.txt
              echo '```'
            else
              echo "**无记录** —— 这一节为空**不代表**天空正常，"
              echo "只代表没查到数据。"
            fi
            echo
            echo "## shader 编译错误"
            echo
            if [ -s verify-evidence/shader-errors.txt ]; then
              echo '```'
              head -40 verify-evidence/shader-errors.txt
              echo '```'
            else
              echo "（无记录。注意：这不等于「干净」—— 可能根本没扫到日志，"
              echo "看下面 Unity 日志一节。）"
            fi
            echo
            echo "## Unity 日志"
            echo
            if [ -f verify-evidence/Editor.log ]; then
              echo "大小 $(wc -c < verify-evidence/Editor.log) 字节"
              echo
              echo '```'
              grep -a -E "Shader (error|warning) in|error in '" | head -30
              echo '```'
            else
              echo "**没找到 Unity Editor.log** —— shader 结论无依据。"
            fi
            echo
            echo "## URP 里的 APV / SSBO 门控"
            echo
            if [ -s verify-evidence/urp-apv-guards.txt ]; then
              echo '```'
              head -60 verify-evidence/urp-apv-guards.txt
              echo '```'
            else
              echo "（无记录 —— PackageCache 里大概率没有 .shader 源码，"
              echo "Unity 装的是编译产物。）"
            fi
            echo
            echo "## 官方 shader 覆盖结果"
            echo
            echo "这决定 66 个AssetRipper 空壳的命运 —— 其中 **59 个材质"
            echo "用Universal Render Pipeline/Lit**（Level / Fire / Bean /"
            echo "Default 等），18 个 VFX shader 被特效材质用。"
            echo "空壳状态下它们渲成洋红。"
            echo
            if [ -s verify-evidence/official-shader-sync.txt ]; then
              echo '```'
              # **先只取结论段**：覆盖数、验收结论、阻塞原因。
              #
              # 为什么不能直接 head -50：加包目录清单后这一段从 2 行涨到 54 行，
              # 于是 head -50 把「已用官方源码覆盖：N」和整个「覆盖后验收」
              # 全部挤出了窗口 —— 报告里只剩一长串包名，最该看的那几个数字
              # 反而不见了。这正是本项目最熟悉的一类回归：**新加了有用的
              # 信息，却把旧的关键信息挤出去了**，而且报告本身看不出被截断。
              #
              # 所以分两次取：结论段（`### 覆盖后验收` 之前）不限行数，
              # 包清单单独一节且限行。
              #
              # 断言必须存在：`sed -n '1,/锚点/p'` 一旦锚点没了就输出空，
              # 而「空」和「没有结论」在报告里长得一样 —— 所以锚点找不到时
              # 明确说「锚点已变」，不能就这么留一片空白。
              SYNC=verify-evidence/official-shader-sync.txt
              if grep -q '^### 覆盖后验收' "$SYNC"; then
                sed -n '1,/^### 覆盖后验收/p' "$SYNC" | grep -v '^$'
              else
                echo "::warning::official-shader-sync.txt 里找不到「### 覆盖后验收」锚点"
                echo "（脚本结构可能变了 —— 下面按原样输出前 80 行，请人工确认结论段在哪）"
                head -80 "$SYNC"
              fi
              echo '```'
              echo
              echo "**包目录清单（$(grep -c '^  com.unity' \
                verify-evidence/official-shader-sync.txt) 个，略）**"
              echo '```'
              grep '^  com.unity' verify-evidence/official-shader-sync.txt \
                | head -8
              echo "..."
              echo '```'
              echo
              echo "### 覆盖后验收"
              echo
              echo '```'
              sed -n '/### 覆盖后验收/,$p' \
                verify-evidence/official-shader-sync.txt | head -60
              echo '```'
            else
              echo "（无记录 —— 脚本没产出任何东西。）"
            fi
            echo
            echo "## PackageCache 实际内容"
            echo
            echo "重点看 **com.unity.render-pipelines.universal 在不在**。"
            echo "上一轮报告里只有 core 包、没有 universal，"
            echo "这意味着 URP/Lit 很可能拿不到官方源码。"
            echo
            echo '```'
            ls Library/PackageCache 2>/dev/null | head -40 \
              || echo "（目录不存在）"
            echo '```'
            echo
            echo "URP 包目录:"
            echo '```'
            ls -d Library/PackageCache/com.unity.render-pipelines.* 2>/dev/null \
              || echo "  （无 —— URP 包未安装到 PackageCache）"
            echo '```'
            echo
            echo "core/universal 包里的 .shader 源码数:"
            echo '```'
            for d in Library/PackageCache/com.unity.render-pipelines.*; do
              [ -d "$d" ] || continue
              echo "  $(basename $d): $(find "$d" -name '*.shader' 2>/dev/null | wc -l) 个 .shader"
            done
            echo '```'
          } > "$OUT"

          # 上限保护：报告只留最近 12 份，别把仓库撑大
          ls -1t docs/ci-reports/*.md 2>/dev/null | tail -n +13 \
            | while read -r old; do rm -f "$old"; done

          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          # 截图放在 ci-screenshots/ 而不是工作区根目录：后者已被 .gitignore
          # 忽略（verify-evidence/ 那些是CI 中间产物），而且同名文件在
          # 两个分支上会互相覆盖。
          mkdir -p docs/ci-screenshots
          SHOTS=""
          for s in verify_loaded.png verify_settled.png; do
            if [ -f "$s" ]; then
              cp "$s" "docs/ci-screenshots/$s"
              SHOTS="$SHOTS $s"
            fi
          done
          # 点击前/后两张。它们才是「能不能玩」的直接证据 ——
          # 前两张只证明引擎活着。
          # 注意 verify_ingame.py 把截图写在 /tmp（和verify_load.py 一致），
          # 而这里读的是工作区根目录，所以先复制过来再收。
          for s in ingame_before.png ingame_after.png; do
            if [ -f "/tmp/$s" ] && [ ! -f "$s" ]; then
              cp -f "/tmp/$s" "$s"
            fi
            if [ -f "$s" ]; then
              cp "$s" "docs/ci-screenshots/$s"
              SHOTS="$SHOTS $s"
            fi
          done
          # 洋红统计单独抽出来写成一个可 grep 的小文件：报告正文里那行
          # 混在 markdown 表格里不好找，而这个数字就是「画面对不对」的判据。
          MAGENTA=""
          if [ -f verify-evidence/magenta.txt ]; then
            cp verify-evidence/magenta.txt docs/ci-screenshots/magenta.txt
            MAGENTA=" magenta.txt"
          fi

          git add -f "$OUT" docs/ci-reports 2>/dev/null
          [ -n "$SHOTS$MAGENTA" ] && git add -f docs/ci-screenshots 2>/dev/null
          # **不要**在这里 `exit 0`。上一版有个
          #   if (git diff --cached --quiet); then echo 报告无变化; exit 0; fi
          # 看着是「无变化就别白跑一趟」，实际后果是：**报告已经写好了，
          # 却因为另一件事无变化而被丢掉**。上一轮就是这样 —— 报告步骤
          # 明明跑完了，ci-diagnostics 分支却还是上一轮的提交，
          # 于是「CI 到底查到了什么」又变成只能猜。
          if git diff --cached --quiet; then
            echo "报告与截图均无变化，跳过提交"
            exit 0
          fi
          # 先 commit 再 push —— push 未提交的改动必然失败。
          # commit 失败同样要炸出来：如果它失败而后面继续跑，
          # push 会把**上一次构建**的 HEAD 再推一遍（no-op），
          # 于是又一次出现「步骤全绿、分支却没更新」。
          if ! git commit -q -m "ci: 诊断报告 run ${GITHUB_RUN_ID}"; then
            echo "::error::诊断报告 commit 失败（暂存区非空却提交不了）"
            git status --short | head -20
            exit 1
          fi
          # push 失败**必须以 annotation 形式炸出来**，不能再
          # `|| echo warning` 咽下去。
          #
          # run 37420327376 的真正教训：17 个步骤全部 success，
          # ci-diagnostics 分支却还是两次之前的提交。两个原因叠在一起：
          #   1) `|| echo ::warning::` 把 push 失败咽掉了
          #   2) **push 被非快进拒绝** —— ci-diagnostics 上的提交
          #      （6cab596）不在 main 的祖先链上：
          #        git merge-base --is-ancestor 6cab596 <HEAD>  -> 非 0
          #      所以每轮都是「报告写好了、commit 了、push 被拒」，
          #      而页面上只看得到 success。
          #
          # 用 `+refs/heads/` 强推：这个分支只存 CI 产物，
          # 不需要保留线性历史，强推不会丢任何有价值的东西
          # （真要追溯，旧报告也传到了 artifact里）。
          #
          # commit 失败 / push 失败都 exit 1（本步骤有 if: always()，
          # 不影响构建结论），让 job 变红 —— 这样在 run 列表里一眼能看见，
          # 而不是靠翻 warning。
          if ! git push --force origin HEAD:refs/heads/ci-diagnostics; then
            echo "::error::诊断报告 push 失败 —— 报告与截图没能提交回仓库，"
            echo "::error::这一轮的 CI 结论（洋红面积 / Editor.log / "
            echo "::error::PackageCache 内容）**无法从仓库读取**，等于这一轮白跑。"
            git log --oneline -3 || true
            exit 1
          fi
          echo "已推送: $(git rev-parse --short HEAD) -> ci-diagnostics"

      - name: Upload WebGL build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build
          retention-days: 30
          if-no-files-found: error

      # 验证过程的日志与截图。单独一个 artifact，且 if: always()——
      # 验证失败时这恰恰是最想看的东西，跟着 build 走会一起被跳过。
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: verify-evidence
          retention-days: 30
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "### 构建结果 ###" >> "$GITHUB_STEP_SUMMARY"
          if [ -d build ]; then
            du -sh build | tee -a "$GITHUB_STEP_SUMMARY"
            find build -maxdepth 2 -type f | head -50 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "**未生成 build 目录，构建失败。**" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
