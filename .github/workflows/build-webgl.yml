name: WebGL Cloud Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Restore Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Assets/**') }}
          restore-keys: |
            Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-
            Library-WebGL-

      # 把 URP/Core/ShaderGraph 包里的官方 shader 源码覆盖到 AssetRipper 留下的
      # 空壳上（按 Shader "名字" 匹配，保留 .meta GUID 所以材质引用不断）。
      # 版本来自 Library/PackageCache，与 Packages/manifest.json 声明的完全一致，
      # 不需要在网上猜版本；缓存未命中时脚本自行跳过，构建照常进行。
      - name: Restore official shader sources
        run: python3 tools/sync_official_shaders.py

      # 使用 game-ci/unity-builder v6 —— 这是首个内置 `personal` 授权策略的版本。
      #
      # 为什么必须用 v6 而不是 v4：
      #   v4 的 activate.sh 只有两条分支（serial / 许可服务器），Unity Personal
      #   根本走不通，导致 7 次构建全部失败在授权阶段。
      #
      #   v6 委托给 game-ci/cli，其激活链为 file -> serial -> floating -> personal。
      #   本仓库只提供 UNITY_EMAIL + UNITY_PASSWORD（不提供 UNITY_LICENSE /
      #   UNITY_SERIAL），因此自动解析到 `personal` 分支。该分支直接调用
      #   Unity.Licensing.Client 的 --activate-all --include-personal，
      #   正是 Unity 6 entitlement 体系下 Personal 账号唯一可行的激活路径。
      #
      #   关键背景：Unity 已取消 Personal 的离线（人工）激活，
      #   license.unity3d.com/manual 现在只对 Enterprise / Industry 开放。
      #   所以任何 .ulf 文件对免费账号都不可能存在 —— 之前 34 字节的
      #   UNITY_LICENSE 是死路，不是配置问题。
      #
      # 注意：personal 授权会占用一个 Personal seat，v6 会在 build 结束
      # （含失败/取消）时自动归还。若频繁失败导致 seat 被泄漏，
      # 到 https://id.unity.com 手动释放。
      - name: Build WebGL
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: WebGLCloudBuild.CloudWebGLBuild.Perform
          dockerMemoryLimit: 15g
          # 必须 None，不能留默认 Semantic，也不能写 NoIncrement。
          # 这个 game-ci CLI 版本（v0.1.72）的合法值是
          #   None / Semantic / Tag / Custom
          # Semantic 会在 build 前跑 `git status --porcelain`，
          # 一旦树"脏"就直接 [ERROR] Branch is dirty 退出；
          # CI 把 Library/ 从缓存恢复出来后它必然未跟踪 -> 树脏。
          # （Library/ 已加进 .gitignore，但其他未跟踪文件也可能让树脏。）
          # None = 直接用 ProjectSettings 里的现有版本，不做任何语义计算，
          # 因此不查脏树，最稳。NoIncrement 不是合法值，会直接报
          # "Invalid values ... Choices: None, Semantic, Tag, Custom"。
          versioning: None
          # 钉死 game-ci CLI 版本，别留默认的 latest。
          # latest 会让 action 每轮启动时调 GitHub API 解析最新 release；
          # 托管 runner 的出口 IP 是共享的，API 配额说没就没 —— run
          # 37299223456 就死在这里（"Failed to resolve the latest game-ci
          # CLI release: GitHub API returned 403"），连 Unity 都没启动。
          # 钉住后走本地解析+缓存（cache key: game-ci-cli-v0.1.72-linux-x64），
          # 不再依赖那一发 API 请求。
          cliVersion: v0.1.72

      - name: Save Library cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Assets/**') }}

      # 在构建机上真的把播放器跑起来。
      #
      # 为什么必须这一步：轮次 23 出现过"构建全绿、产物 207MB、B 层离线校验
      # 12/12 全过，但一加载场景就抛 function signature mismatch"。离线校验
      # 只证明文件完整，证明不了它能跑。把验证放在构建机上，产物根本不用经过
      # 我的沙箱（上行 77KB/s，186MB 要 40 分钟）。
      #
      # 判据是Unity 模板里 #unity-loading-bar 变成 display:none，
      # 也就是 createUnityInstance().then() 那个分支—— 主场景真的加载完了。
      # 不要改成"画布拿到 WebGL 上下文"：那发生在 wasm 实例化时，
      # 也就是加载场景之前，而签名不匹配恰恰是在加载场景时抛的，
      # 那样判据在坏产物上照样会通过。见 tools/verify_load.py 的注释。
      #
      # 三个浏览器参数缺一不可，少一个就是"环境不支持 WebGL"而非"产物有问题"：
      #   xvfb-run                 没有 X server，Chrome 连 GL 后端都起不来
      #   --use-angle=swiftshader  软件实现 WebGL2（runner 无 GPU）
      #   --enable-unsafe-swiftshader  新版 Chrome 默认禁用软件 WebGL
      - name: Verify the build actually loads
        if: always()
        run: |
          set +e
          echo "### 产物实跑验证 ###" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f build/WebGL/index.html ]; then
            echo "**无 build/WebGL/index.html，跳过。**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---- xvfb：只在该装的时候装 ----
          #
          # GitHub runner 镜像自带 Xvfb（Firefox 的 bedrock 仓库为此专门
          # 去掉过安装步骤，原话是"apt-install of things"是 GHA 上最不
          # 可靠的一环之一）。之前这里无条件 apt-get install xvfb，
          # run 37266853299 就挂在这一步之后。
          #
          # 但不能只信"runner 自带"：万一换了镜像或被裁剪过，
          # 没有 X server 的症状是 Chrome 报 "Missing X server or $DISPLAY"，
          # 看起来像产物问题。所以是"有就用，没有才装"，
          # 并且装完立刻复查，别让失败静默滑过去。
          if command -v Xvfb > /dev/null 2>&1; then
            echo "Xvfb 已就绪: $(command -v Xvfb)"
          else
            echo "Xvfb 缺失，尝试安装"
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
            if ! command -v Xvfb > /dev/null 2>&1; then
              echo "::error::装不上 Xvfb，软件渲染验证无法进行（这是环境问题，不是产物问题）"
              echo "**Xvfb 不可用，实跑验证未执行。**" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Xvfb 安装完成: $(command -v Xvfb)"
          fi

          # ---- playwright（只装库，不下浏览器）----
          #
          # 必须用 venv：直接 pip3 install 会报
          #   Permission denied: '/home/runner/.local/lib'
          # 因为 unity-builder 以 root 跑过构建，runner 用户的 HOME 下
          # 若干目录的属主变成了 root，pip 又不肯降级写入。
          # venv 建在 /tmp 下，绕开这个权限残局。
          # （venv + pip 实测只要 7 秒，不是瓶颈。）
          python3 -m venv /tmp/venv || { echo "::error::建venv 失败"; exit 1; }
          /tmp/venv/bin/pip install -q playwright || {
            echo "::error::装 playwright 失败"; exit 1; }

          # 不下playwright 自带的 Chromium。
          #
          # 实测数据：venv + pip 只要 7 秒，而 "playwright install chromium"
          # 下 170 MB 跑了 8 分钟仍未完成。run 37267536242 的验证步骤
          # 总共只有 36 秒 —— 装浏览器的时间根本不够，那个失败
          # 几乎肯定卡在这里。
          #
          # runner 镜像自带 Chrome/Chromium，直接用它：
          # 少一个 170MB 下载，也就少一个失败点。
          # tools/verify_load.py 里的 find_chrome() 会按这个顺序找。
          echo "--- 找runner 自带的浏览器"
          for b in /usr/bin/google-chrome /usr/bin/google-chrome-stable \
                   /usr/bin/chromium /usr/bin/chromium-browser \
                   /opt/google/chrome/chrome; do
            if [ -x "$b" ]; then
              echo "找到: $b"
              "$b" --version 2>/dev/null | head -1
              break
            fi
          done

          # Chromium 的系统依赖。之前这里无条件 apt-get install 一串库，
          # 同样有把 apt 状态搞坏的风险（run 37266853299 就是前车之鉴：
          # 报E: Unmet dependencies，而 set +e 让它静默滑过去）。
          # runner 镜像本来就带齐了这些库，真的缺的话
          # launch 会明确报缺哪个 .so —— 那比语焉不详的 apt 错误有用得多。
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2 2>&1 | tail -2
          echo "（上面若有 apt 报错可忽略：镜像自带这些库）"

          # 先剥掉 Windows 版的死重量，再解压。
          #
          # 产物里带着 89 MB Windows 专用资源
          # （StreamingAssets/aa/StandaloneWindows64 和 APVStreamingAssets），
          # WebGL 运行时不会有任何代码去读它们—— settings.json 里
          # m_buildTarget 写死 StandaloneWindows64，catalog 里也没有
          # WebGL 路径，而脚本里 Addressables 引用数为 0。
          # 详见 tools/strip_platform_assets.py 里的三条证据。
          #
          # 放在解压之前，是因为 .gz 也要一起删掉；
          # 放在验证之前，是因为要验证的正是用户最终会拿到的那份产物。
          #
          # 必须 sudo：unity-builder 以 root 构建，产物属主是 root，
          # runner 用户 rmtree 会Permission denied。
          # 上一版忘了 sudo，日志里明明白白写着
          #   ::warning::剥离平台资源失败，继续用完整产物
          # 而我直到抓注解才看到——体积一点没降。
          sudo python3 tools/strip_platform_assets.py build/WebGL --apply || \
            echo "::warning::剥离平台资源失败，继续用完整产物（只是体积大）"

          # 必须预解压并去掉 Content-Encoding：body 已是解压态，
          # 再声明压缩会让浏览器把裸数据当压缩流解，结果是坏的。
          #
          # 整个脚本用 sudo 跑：unity-builder 以 root 构建，产物属主是 root，
          # runner 用户 open(..., "wb") 会Permission denied。
          # 第一版就是这么失败的（WebGL.wasm 写不进去）。
          sudo python3 - <<'PY'
          import gzip, pathlib, shutil, sys
          root = pathlib.Path("build/WebGL")
          for gz in sorted(root.rglob("*.gz")):
              out = gz.with_name(gz.name[:-3])
              # 已有非空的裸文件就跳过：Library 缓存或重跑会让它先于
              # 上一步存在，写它同样会撞权限。
              if out.exists() and out.stat().st_size > 0:
                  print(f"跳过 {out.name}（已存在）")
                  continue
              with gzip.open(gz, "rb") as fi, open(out, "wb") as fo:
                  shutil.copyfileobj(fi, fo, length=1 << 20)
              print(f"解压 {gz.name} -> {out.name}"
                    f"({out.stat().st_size / 1048576:.1f} MB)")

          # index.html 里写的是 .gz 文件名，改成无后缀的裸文件名，
          # 这样不依赖任何响应头。
          html = root / "index.html"
          t = original = html.read_text(encoding="utf-8")
          for n in ("WebGL.data", "WebGL.wasm", "WebGL.framework.js"):
              t = t.replace(f"/{n}.gz", f"/{n}")
          if t != original:
              html.write_text(t, encoding="utf-8")
              print("index.html 已改为引用裸文件名")
          else:
              print("index.html 已是裸文件名")

          # 解压失败必须在这里停住。步骤开头有 set +e（为了不让
          # 验证脚本的失败被吞），所以不主动 exit 的话，解压挂了会
          # 一路滑到验证脚本，报出来的是"加载失败"这种二手结论，
          # 而真正原因是"文件没解开"。一手信息不该被二手结论盖掉。
          missing = [n for n in ("WebGL.data", "WebGL.wasm",
                                 "WebGL.framework.js", "WebGL.loader.js")
                     if not (root / "Build" / n).exists()]
          if missing:
              print("!! 解压后仍缺文件: " + ", ".join(missing), flush=True)
              sys.exit(1)
          print("三个大文件均已就位")
          PY
          if [ $? -ne 0 ]; then
            echo "::error::解压产物失败，验证无法进行"
            exit 1
          fi

          # 端口选8123，不选 8099。
          # Chromium 有一份「受限端口」名单（6000/666x/6697/10080 等），
          # 命中会直接net::ERR_UNSAFE_PORT，而且这个错发生在网络层，
          # 看起来像「服务没起来」，实际上是浏览器不让连。
          python3 -m http.server 8123 --directory build/WebGL > /tmp/srv.log 2>&1 &
          SRV=$!
          sleep 3
          curl -s -o /dev/null -w "index.html HTTP=%{http_code}\n" http://127.0.0.1:8123/
          curl -s -o /dev/null -w "loaderHTTP=%{http_code}\n" \
            http://127.0.0.1:8123/Build/WebGL.loader.js

          # 验证逻辑放在 tools/verify_load.py，不内嵌在 heredoc 里。
          # 两个实测过的坑：
          #   xvfb-run 会把 heredoc 从 stdin 拿走（去喂 xauth），
          #     sys.stdin.read() 返回空字符串；
          #   stdout 重定向到文件是块缓冲，脚本中途异常退出时
          #     缓冲区里的 print 全丢，只剩带flush 的第一行。
          # 写成文件后代码从文件读、所有 print 带 flush、异常路径有 traceback。
          #
          # 端口/超时用环境变量传，不写死在脚本里。
          export PLAYWRIGHT_BROWSERS_PATH=/tmp/pw-browsers
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          export VERIFY_URL=http://127.0.0.1:8123/
          export VERIFY_TIMEOUT=600

          # 注意没有 `| tee` —— 管道的退出码是最后一个命令的，
          # Python 的失败会被 tee 吞掉。第一版正是这样：
          # 解压 PermissionError、playwright ModuleNotFound，
          # 验证脚本压根没跑，步骤仍然 success。
          set +e
          timeout 780 xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/venv/bin/python tools/verify_load.py "$GITHUB_STEP_SUMMARY" \
            > /tmp/verify.log 2>&1
          VR=$?
          cat /tmp/verify.log
          set -e

          # 把日志和截图打包上传，理由很直接：
          # GitHub 的 job 日志下载接口要仓库管理员权限，
          # 我这个token 不是管理员，run 37266853299 失败时
          # 就只能看到"某个步骤红了"，看不到红在哪一行——
          # 只能靠猜。产物跑完了还在机器上，
          # 传出来比重新构建一次（十几分钟）便宜得多。
          mkdir -p verify-evidence
          cp -f /tmp/verify.log verify-evidence/ 2>/dev/null
          cp -f /tmp/verify_first_error.txt verify-evidence/ 2>/dev/null
          # console 全文：Unity C# 的 Debug.Log 全走 console，崩溃前最后几条
          # 日志直接写明引擎正在初始化什么。没有它，null function 只有索引没有语义。
          cp -f /tmp/verify_console.txt verify-evidence/ 2>/dev/null
          cp -f /tmp/srv.log verify-evidence/http-server.log 2>/dev/null
          cp -f verify_loaded.png verify_settled.png verify-evidence/ 2>/dev/null

          # 验证失败时，让构建机自己读 wasm 把结论报出来。
          #
          # 背景：签名错修好之后，错误变成了
          #   RuntimeError: null function at wasm-function[103863]
          # 这个问题源码层面看不出来——33 个方法名、签名、调用点
          # 全部核对无误（读 16/16、写 17/17）。只能读产物字节码。
          #
          # 而产物在构建机上。把 195 MB 下载到本地要 40 分钟
          # （上行 77 KB/s），让机器自己分析只要几秒。
          # wabt 的 wasm-objdump 是标准工具，解析正确；
          # 缺了就退回inspect_wasm.py 内置的解析器。
          if [ "$VR" -ne 0 ] && [ "$VR" -ne 4 ] && [ -f build/WebGL/Build/WebGL.wasm ]; then
            echo "--- 分析 wasm 函数表"
            # 从首因里抠出 wasm-function[NNN]
            WIDX=$(grep -a -oE 'wasm-function\[[0-9]+\]' \
              /tmp/verify_first_error.txt 2>/dev/null \
              | head -1 | grep -oE '[0-9]+' || true)
            echo "报错函数索引: ${WIDX:-（日志里没找到）}"
            sudo apt-get install -y -qq wabt 2>&1 | tail -1
            python3 tools/inspect_wasm.py build/WebGL/Build/WebGL.wasm \
              ${WIDX:+$WIDX} > /tmp/wasm_report.txt 2>&1
            # 只取关键行，避免注解过长被截断
            grep -E "表总项数|起始槽位|无条目|func\[|签名" \
              /tmp/wasm_report.txt 2>/dev/null | head -12 \
              >> verify-evidence/wasm-report.txt || true
            cat /tmp/wasm_report.txt 2>/dev/null | head -20

            # 光看一个函数不够——要看整条调用链。
            #
            # 判读的关键是比对「调用点期望的 type」和
            # 「被调函数实际的 type」。参数个数对不上就是
            # function signature mismatch，跟槽位空不空无关。
            # 只看报错的那个函数会看漏，必须顺着栈往下读。
            #
            # --no-disasm：整份 66 MB 反汇编要几分钟，
            # 而签名和表项用 wasm-objdump -x 就能拿到，几秒就够。
            # 判读 type 是否匹配不需要反汇编。
            echo "--- 解调用链"
            python3 tools/explain_crash.py build/WebGL/Build/WebGL.wasm \
              --stack-file /tmp/verify_first_error.txt --no-disasm \
              > /tmp/stack_report.txt 2>&1 || true
            head -30 /tmp/stack_report.txt 2>/dev/null || true
            {
              echo "=== 调用链（按栈顺序）==="
              grep -E "^\s*(func\[|表槽位|判定|>>)" /tmp/stack_report.txt 2>/dev/null \
                | head -30
            } >> verify-evidence/wasm-report.txt || true
          fi
          {
            echo "Xvfb: $(command -v Xvfb || echo缺失)"
            echo "浏览器: $(for b in /usr/bin/google-chrome \
              /usr/bin/google-chrome-stable /usr/bin/chromium \
              /usr/bin/chromium-browser; do \
              [ -x "$b" ] && echo "$b" && break; done)"
            echo "端口探测: $(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8123/ 2>/dev/null)"
            echo "日期: $(date -u)"
          } > verify-evidence/env.txt
          echo "---证据已收集到 verify-evidence/"

          # 把结论写进 check 的 title/summary。
          #
          # 理由：我这个token 不是仓库管理员，job 日志接口返回
          #   403 Must have admin rights
          # artifact 下载接口返回
          #   401 Requires authentication
          # 也就是说前两轮失败（run 37266853299 / 37267536242）
          # 我只能看到"某一步红了"，看不到红在哪，
          # 只能靠时间线猜——而猜错的代价是一次十几分钟的构建。
          #
          # 关键教训：上一版把结论写进了 step summary，
          # 但 step summary 在页面上是异步加载的片段，
          # 匿名curl 抓 run 页面根本取不到正文（实测只拿到
          # "退出码 2"这一句 注解里的文字）。
          # 而 ::error:: / ::warning:: 注解是直接出现在 run 页面
          # 列表里的，curl 抓得到。所以结论必须走注解。
          #
          # 顺便：上一轮拿到"退出码 2"就说明环境那关过了——
          # 浏览器起来了、页面加载了、然后报错。
          # 退出码 2 = 页面alert 或未捕获 JS 异常。
          # 优先用 verify_load.py 落盘的首因文件（完整 wasm 栈），
          # 退回到 grep 日志。这样"null function"这类需要看栈才能定位的
          # 错误，不会因为注解只能放一行而被削成一句没用的结论。
          if [ -f /tmp/verify_first_error.txt ]; then
            ALERTLINE=$(head -4 /tmp/verify_first_error.txt | tr '\n\r' '  ' \
              | sed 's/%/%25/g; s/:/%3A/g' | cut -c1-200)
          else
            ALERTLINE=$(grep -a -m1 -oE 'alert（[^）]*）: .{0,180}' \
              /tmp/verify.log 2>/dev/null | tr '\n\r' '  ' | cut -c1-200)
            [ -z "$ALERTLINE" ] && ALERTLINE=$(head -5 /tmp/verify.log 2>/dev/null \
              | tr '\n' ' ' | cut -c1-200)
          fi
          [ -z "$ALERTLINE" ] && ALERTLINE="（无日志，脚本可能没跑到打印）"

          # wasm 分析结论也拼进注解。null function 这类问题
          # 光看"函数索引 103863"没法判断，得知道那个槽位是空的
          # 还是签名不符——这两者的修法完全不同。
          if [ -f verify-evidence/wasm-report.txt ]; then
            WSLOT=$(grep -m1 -oE '起始槽位: [0-9]+' \
              verify-evidence/wasm-report.txt 2>/dev/null || true)
            WFUNC=$(grep -m1 -oE 'func\[[0-9]+\] 签名: [^ ]+' \
              verify-evidence/wasm-report.txt 2>/dev/null \
              | sed 's/%/%25/g' || true)
            [ -n "$WSLOT$WFUNC" ] && \
              ALERTLINE="$ALERTLINE | ${WSLOT} ${WFUNC}"
          fi
          BROWSER=$(for b in /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable /usr/bin/chromium \
            /usr/bin/chromium-browser; do
            [ -x "$b" ] && echo "$b" && break; done)
          [ -z "$BROWSER" ] && BROWSER="（未找到任何浏览器）"

          {
            echo "### 产物实跑验证"
            echo ""
            echo "退出码 \`$VR\` | 浏览器 \`$BROWSER\`"
            echo ""
            echo "首因："
            echo '```'
            echo "${ALERTLINE:-（无日志）}"
            echo '```'
            echo ""
            echo "完整日志在 verify-evidence artifact 里（需登录下载）。"
          } > /tmp/vr_summary.md
          tail -25 /tmp/verify.log 2>/dev/null | sed 's/^/    /' \
            >> /tmp/vr_summary.md || true

          case "$VR" in
            0)
              TITLE="验证通过：主场景加载完成"
              ;;
            4)
              # 软件渲染下 600s 仍未加载完，可能是慢而不是坏。
              # 如实记 warning，不让整个 job 变红（产物本身可能没问题，
              # 只是这台 runner 的 CPU 跑不动）。
              TITLE="验证超时（不判失败）"
              ;;
            1)
              TITLE="验证失败：function signature mismatch 仍存在"
              ;;
            2)
              TITLE="验证失败：页面报错，退出码 2"
              ;;
            3)
              TITLE="验证脚本自身出错，产物未被验证"
              ;;
            *)
              TITLE="验证失败，退出码 $VR"
              ;;
          esac
          echo "验证结论: $TITLE" >> "$GITHUB_STEP_SUMMARY"

          # 结论写进注解。注解直接出现在 run 页面，匿名可抓——
          # 这是实测唯一能读到的通道（step summary 抓不到）。
          # 单行、去掉换行，注解才不会被截断。
          # 还要转义 GitHub 注解的控制字符：% CR LF。
          # 错误信息里出现这三样东西的概率不低（堆栈、路径、进度百分比），
          # 而未转义的 % 会被当成转义序列，把后面的内容吃掉。
          ONELINE=$(echo "$ALERTLINE" | tr '\n\r' '  ' | tr -d '\r' \
            | sed 's/%/%25/g; s/:/%3A/g' | cut -c1-200)
          if [ "$VR" -eq 0 ]; then
            echo "::notice title=验证通过::主场景加载完成，用时见 summary"
          elif [ "$VR" -eq 4 ]; then
            echo "::warning title=验证超时::软件渲染下未在600s 内完成加载，判为环境慢而非产物坏"
          else
            echo "::error title=$TITLE::${ONELINE:-（无日志，脚本可能没跑到打印）}"
          fi

          # 非 0 且不是"超时"就一定让步骤红。
          # 退出码 4 是唯一的例外：软件渲染可能只是慢，
          # 那不等于产物有问题，如实记 warning 就好。
          if [ "$VR" -ne 0 ] && [ "$VR" -ne 4 ]; then
            exit 1
          fi

      - name: Publish verification verdict
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try { body = fs.readFileSync('/tmp/vr_summary.md', 'utf8'); }
            catch (e) { body = '（读不到验证摘要：' + e.message + '）'; }
            await core.summary.addRaw(body).write();
            core.info('验证摘要已写入 step summary');

      - name: Upload WebGL build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build
          retention-days: 30
          if-no-files-found: error

      # 验证过程的日志与截图。单独一个 artifact，且 if: always()——
      # 验证失败时这恰恰是最想看的东西，跟着 build 走会一起被跳过。
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: verify-evidence
          retention-days: 30
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "### 构建结果 ###" >> "$GITHUB_STEP_SUMMARY"
          if [ -d build ]; then
            du -sh build | tee -a "$GITHUB_STEP_SUMMARY"
            find build -maxdepth 2 -type f | head -50 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "**未生成 build 目录，构建失败。**" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
