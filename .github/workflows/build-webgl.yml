name: WebGL Cloud Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Restore Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Assets/**') }}
          restore-keys: |
            Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-
            Library-WebGL-

      # 使用 game-ci/unity-builder v6 —— 这是首个内置 `personal` 授权策略的版本。
      #
      # 为什么必须用 v6 而不是 v4：
      #   v4 的 activate.sh 只有两条分支（serial / 许可服务器），Unity Personal
      #   根本走不通，导致 7 次构建全部失败在授权阶段。
      #
      #   v6 委托给 game-ci/cli，其激活链为 file -> serial -> floating -> personal。
      #   本仓库只提供 UNITY_EMAIL + UNITY_PASSWORD（不提供 UNITY_LICENSE /
      #   UNITY_SERIAL），因此自动解析到 `personal` 分支。该分支直接调用
      #   Unity.Licensing.Client 的 --activate-all --include-personal，
      #   正是 Unity 6 entitlement 体系下 Personal 账号唯一可行的激活路径。
      #
      #   关键背景：Unity 已取消 Personal 的离线（人工）激活，
      #   license.unity3d.com/manual 现在只对 Enterprise / Industry 开放。
      #   所以任何 .ulf 文件对免费账号都不可能存在 —— 之前 34 字节的
      #   UNITY_LICENSE 是死路，不是配置问题。
      #
      # 注意：personal 授权会占用一个 Personal seat，v6 会在 build 结束
      # （含失败/取消）时自动归还。若频繁失败导致 seat 被泄漏，
      # 到 https://id.unity.com 手动释放。
      - name: Build WebGL
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: WebGLCloudBuild.CloudWebGLBuild.Perform
          dockerMemoryLimit: 15g

      - name: Save Library cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Assets/**') }}

      # 在构建机上真的把播放器跑起来。
      #
      # 为什么必须这一步：轮次 23 出现过"构建全绿、产物 207MB、B 层离线校验
      # 12/12 全过，但一加载场景就抛 function signature mismatch"。离线校验
      # 只证明文件完整，证明不了它能跑。把验证放在构建机上，产物根本不用经过
      # 我的沙箱（上行 77KB/s，186MB 要 40 分钟）。
      #
      # 三个参数缺一不可，少一个就是"环境不支持WebGL"而非"产物有问题"：
      #   xvfb-run                 没有 X server，Chrome 连 GL 后端都起不来
      #   --use-angle=swiftshader  软件实现 WebGL2（runner 无 GPU）
      #   --enable-unsafe-swiftshader  新版 Chrome 默认禁用软件 WebGL
      - name: Verify the build actually loads
        if: always()
        run: |
          set +e
          echo "### 产物实跑验证 ###" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f build/WebGL/index.html ]; then
            echo "**无 build/WebGL/index.html，跳过。**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb > /dev/null

          # runner 镜像不带 playwright 和它的 Chromium。
          #
          # 必须用 venv：直接 pip3 install 会报
          #   Permission denied: '/home/runner/.local/lib'
          # 因为 unity-builder 以 root 跑过构建，runner 用户的 HOME 下
          # 若干目录的属主变成了 root，pip 又不肯降级写入。
          # venv 建在 /tmp 下，绕开这个权限残局。
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q playwright
          # 浏览器二进制必须显式指到 /tmp。默认落在 ~/.cache/ms-playwright，
          # 而 unity-builder 以 root 跑过构建，那个目录属主已经是 root，
          # runner 用户写不进去 —— 结果 pip 成功了、浏览器没有，
          # launch 时报 "Executable doesn't exist at .../chromium-1243/..."。
          PLAYWRIGHT_BROWSERS_PATH=/tmp/pw-browsers \
            /tmp/venv/bin/playwright install chromium
          # 后续那步也要用同一个变量，否则找不到刚下的浏览器。
          echo "PLAYWRIGHT_BROWSERS_PATH=/tmp/pw-browsers" >> "$GITHUB_ENV"
          ls /tmp/pw-browsers | head -3

          # Chromium 的系统依赖单独装，不用 `playwright install --with-deps`
          # —— 那条会自己调apt，可能和 unity-builder 留下的包状态打架。
          sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 > /dev/null

          # 必须预解压并去掉 Content-Encoding：body 已是解压态，
          # 再声明压缩会让浏览器把裸数据当压缩流解，结果是坏的。
          #
          # 整个脚本用 sudo 跑：unity-builder 以 root 构建，产物属主是 root，
          # runner 用户 open(..., "wb") 会Permission denied。
          # 第一版就是这么失败的（WebGL.wasm 写不进去）。
          sudo python3 - <<'PY'
          import gzip, pathlib, shutil
          root = pathlib.Path("build/WebGL")
          for gz in sorted(root.rglob("*.gz")):
              out = gz.with_name(gz.name[:-3])
              # 已有非空的裸文件就跳过：Library 缓存或重跑会让它先于
              # 上一步存在，写它同样会撞权限。
              if out.exists() and out.stat().st_size > 0:
                  print(f"跳过 {out.name}（已存在）")
                  continue
              with gzip.open(gz, "rb") as fi, open(out, "wb") as fo:
                  shutil.copyfileobj(fi, fo, length=1 << 20)
              print(f"解压 {gz.name} -> {out.name}"
                    f"({out.stat().st_size / 1048576:.1f} MB)")
          # index.html 里写的是 .gz 文件名，改成无后缀的裸文件名，
          # 这样不依赖任何响应头。
          html = root / "index.html"
          t = original = html.read_text(encoding="utf-8")
          for n in ("WebGL.data", "WebGL.wasm", "WebGL.framework.js"):
              t = t.replace(f"/{n}.gz", f"/{n}")
          if t != original:
              html.write_text(t, encoding="utf-8")
              print("index.html 已改为引用裸文件名")
          else:
              print("index.html 已是裸文件名")
          PY

          python3 -m http.server 8099 --directory build/WebGL > /tmp/srv.log 2>&1 &
          SRV=$!
          sleep 3
          curl -s -o /dev/null -w "index.html HTTP=%{http_code}\n" http://127.0.0.1:8099/

          # 三处都指到 /tmp，理由同上：unity-builder 以 root 跑过，
          # runner 用户在 HOME 下写任何东西都可能Permission denied。
          # PLAYWRIGHT_BROWSERS_PATH 由上面的 GITHUB_ENV 传下来。
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          timeout 420 xvfb-run -a -s "-screen 0 1280x800x24" \
            /tmp/venv/bin/python - "$GITHUB_STEP_SUMMARY" > /tmp/verify.log 2>&1 <<'PY'
          import sys, time
          from playwright.sync_api import sync_playwright

          summary = open(sys.argv[1], "a")
          logs = []
          alert = {"msg": None}
          t0 = time.time()

          with sync_playwright() as p:
              b = p.chromium.launch(headless=False, args=[
                  "--use-gl=angle", "--use-angle=swiftshader",
                  "--enable-unsafe-swiftshader", "--ignore-gpu-blocklist",
                  "--disable-dev-shm-usage", "--no-sandbox"])
              pg = b.new_page(viewport={"width": 1280, "height": 800})
              pg.on("console", lambda m: logs.append(f"[{m.type}] {m.text[:200]}"))
              pg.on("pageerror", lambda e: logs.append(f"[pageerror] {str(e)[:200]}"))
              pg.on("dialog", lambda d: (alert.update(msg=d.message[:400]), d.accept()))
              pg.goto("http://127.0.0.1:8099/", wait_until="domcontentloaded", timeout=60000)

              ok = False
              while time.time() - t0 < 360:
                  time.sleep(6)
                  st = pg.evaluate("""() => {
                    const f = document.querySelector('#unity-progress-bar-full');
                    const l = document.querySelector('#unity-loading-bar');
                    const c = document.querySelector('#unity-canvas');
                    let ctx = false;
                    if (c) ctx = !!(c.getContext('webgl2') || c.getContext('webgl'));
                    return {pct: f ? f.style.width : '',
                            vis: l ? l.style.display : '?', ctx};
                  }""")
                  if st["ctx"] or st["vis"] == "none":
                      ok = True
                      break
                  if alert["msg"]:
                      break
              pg.screenshot(path="verify.png")
              b.close()

          el = time.time() - t0
          sig = alert["msg"] and "function signature mismatch" in alert["msg"]
          if sig:
              print("❌ **function signature mismatch 仍存在**", file=summary)
          elif ok:
              print(f"✅ **通过**：{el:.0f}s 内拿到 WebGL 上下文并进入主场景", file=summary)
          elif alert["msg"]:
              print(f"❌ 页面报错：{alert['msg']}", file=summary)
          else:
              print(f"⚠️ 360s 内未完成加载（软件渲染慢，不一定失败）", file=summary)
          print(f"\n耗时 {el:.0f}s\n", file=summary)
          print("```", file=summary)
          for l in logs[-20:]:
              print(l[:200], file=summary)
          print("```", file=summary)
          summary.close()

          # 退出码在Python 里给，不要写成 `if sig; then` —— 那是 shell 语法，
          # 放在 heredoc 里会直接语法错误，整个验证步骤跑不起来。
          # 这个错误是我写完自检时 ast.parse 抓到的。
          sys.exit(1 if sig else 0)
          PY
          VR=$?
          # 日志要出现在 Actions 里，但不能用 `| tee` —— 管道的退出码是
          # 最后一个命令的，Python 失败会被 tee 吞掉。第一版正是这样：
          # 解压和 playwright 都PermissionError / ModuleNotFound，
          # 验证脚本压根没跑，而步骤仍然 success。
          cat /tmp/verify.log

          # Python 异常退出（2/1/其它非 0）也要让步骤红。
          # 唯一容忍的是「跑满 360s 仍未完成」——软件渲染可能只是慢，
          # 那不等于产物有问题。这种情况也如实写进 summary。
          if [ "$VR" -ne 0 ]; then
            if grep -q "未完成加载" "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
              echo "::warning::软件渲染下 360s 未完成加载，不判定为失败"
              exit 0
            fi
            echo "::error::验证脚本退出码 $VR，产物未能通过实跑验证"
            exit 1
          fi
          echo "实跑验证通过"

      - name: Upload WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "### 构建结果 ###" >> "$GITHUB_STEP_SUMMARY"
          if [ -d build ]; then
            du -sh build | tee -a "$GITHUB_STEP_SUMMARY"
            find build -maxdepth 2 -type f | head -50 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "**未生成 build 目录，构建失败。**" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
