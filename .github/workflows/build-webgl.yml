name: WebGL Cloud Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          targetPlatform: WebGL
          buildMethod: CloudWebGLBuild.Perform
          buildName: HowToFish
          buildsPath: build
          customParameters: -nographics -silent-crashes

      - name: Upload WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build
          retention-days: 30
          if-no-files-found: error

      # game-ci/unity-builder 会自动把 Unity 编译/构建日志上传为 game-ci-unity-log artifact，
      # 构建失败时在 Actions 页面下载该 artifact 即可看到具体报错行。
      - name: Summary
        if: always()
        run: |
          echo "### 构建完成 ###" >> "$GITHUB_STEP_SUMMARY"
          if [ -d build ]; then
            du -sh build | tee -a "$GITHUB_STEP_SUMMARY"
            find build -maxdepth 2 -type f | head -50 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成 build 目录，构建可能失败，请查看 game-ci-unity-log artifact。" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
