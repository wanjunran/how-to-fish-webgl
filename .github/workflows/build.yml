name: Unity Cloud Build
on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    name: Build StandaloneWindows64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Assets/**/*.unity', 'Assets/**/*.asset', 'Packages/**/package.json') }}
          restore-keys: |
            Library-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: auto

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: HowToFish-Windows64
          path: build
          retention-days: 14
